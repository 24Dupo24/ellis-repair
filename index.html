<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ellis Coffee Part Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background-color: #0f172a; }
        iframe { background-color: #1e293b; border: none; width: 100%; height: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        const Icon = ({ path, className = "w-5 h-5", fill = "none" }) => (
            <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {path}
            </svg>
        );

        const Icons = {
            Search: () => <Icon path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
            BookOpen: () => <Icon path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Zap: ({ className }) => <Icon className={className || "w-5 h-5"} fill="currentColor" path={<path d="M13 2 L3 14 h9 l-1 8 10-12 h-9 l1-8z"/>} />,
            Menu: () => <Icon path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />,
            X: () => <Icon path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />,
            ChevronRight: () => <Icon className="w-4 h-4" path={<path d="m9 18 6-6-6-6"/>} />,
            FileText: ({ className }) => <Icon className={className || "w-5 h-5"} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></>} />,
            Refresh: () => <Icon className="w-4 h-4 animate-spin" path={<><path d="M21 12a9 9 0 1 1-6.219-8.56"/><path d="M22 2v6h-6"/></>} />,
            Plus: () => <Icon path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            ExternalLink: () => <Icon className="w-4 h-4" path={<><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>} />,
            AlertCircle: () => <Icon className="w-12 h-12 text-slate-700" path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />
        };

        const GITHUB_USERNAME = "24Dupo24"; 
        const REPO_NAME = "ellis-repair"; 
        const BASE_PDF_PATH = "work"; 

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMachine, setSelectedMachine] = useState(null);
            const [isMenuOpen, setIsMenuOpen] = useState(true);
            const [pdfPage, setPdfPage] = useState(1);
            const [machines, setMachines] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);

            const fetchFiles = async () => {
                setIsLoading(true);
                setError(null);
                try {
                    const apiURL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${BASE_PDF_PATH}?t=${Date.now()}`;
                    const response = await fetch(apiURL);
                    
                    if (response.ok) {
                        const data = await response.json();
                        const pdfList = data
                            .filter(file => file.name.toLowerCase().endsWith('.pdf'))
                            .map((file, index) => ({
                                id: `gh-${index}`,
                                name: file.name.replace(/_/g, ' ').replace('.pdf', ''),
                                file: file.name,
                                type: 'github',
                                // We'll try the Pages URL first, but provide the Raw URL as a fallback if needed
                                url: `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/${BASE_PDF_PATH}/${encodeURIComponent(file.name)}`,
                                rawUrl: `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/${BASE_PDF_PATH}/${encodeURIComponent(file.name)}`
                            }));
                        setMachines(prev => [...prev.filter(m => m.type !== 'github'), ...pdfList]);
                    } else {
                        throw new Error(`Folder "${BASE_PDF_PATH}" not found in ${REPO_NAME}.`);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchFiles();
            }, []);

            const handleLocalUpload = (e) => {
                const files = Array.from(e.target.files);
                const localPdfs = files.filter(f => f.type === "application/pdf").map((file, index) => ({
                    id: `local-${Date.now()}-${index}`,
                    name: `[LOCAL] ${file.name.replace('.pdf', '')}`,
                    file: file.name,
                    type: 'local',
                    url: URL.createObjectURL(file),
                    rawUrl: URL.createObjectURL(file)
                }));
                setMachines(prev => [...localPdfs, ...prev]);
            };

            const filteredMachines = useMemo(() => {
                return machines.filter(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()));
            }, [searchQuery, machines]);

            const handleSelectMachine = (machine) => {
                setSelectedMachine(machine);
                setPdfPage(1);
                setIsMenuOpen(false);
            };

            const jumpToPage = (page) => setPdfPage(page);

            // Construct the final URL with the page fragment
            const pdfUrl = selectedMachine 
                ? `${selectedMachine.url}#page=${pdfPage}`
                : null;

            return (
                <div className="flex flex-col h-screen bg-slate-900 text-white font-sans overflow-hidden">
                    <header className="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center z-50 shadow-lg shrink-0">
                        <div className="flex items-center gap-2">
                            <div className="bg-red-600 p-1.5 rounded-lg flex items-center justify-center shadow-lg shadow-red-900/20">
                                <Icons.Zap className="w-5 h-5 text-white" />
                            </div>
                            <h1 className="font-bold tracking-tight text-lg uppercase leading-none">Ellis Coffee <span className="font-light text-slate-400 italic block text-[10px] mt-0.5">Parts Finder</span></h1>
                        </div>
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 hover:bg-slate-700 rounded-full transition-colors active:scale-95">
                            {isMenuOpen ? <Icons.X /> : <Icons.Menu />}
                        </button>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        <aside className={`fixed inset-0 z-40 bg-slate-900 transition-transform duration-300 transform ${isMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 md:w-80 border-r border-slate-800 flex flex-col shadow-2xl md:shadow-none`}>
                            <div className="p-4 bg-slate-900 space-y-3">
                                <div className="relative group">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-red-500 transition-colors"><Icons.Search /></div>
                                    <input
                                        type="text"
                                        placeholder="Search manuals..."
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-red-500/50 text-sm transition-all"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>
                                
                                <label className="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl py-2 px-4 cursor-pointer transition-colors text-[10px] font-bold text-slate-400 active:scale-95 uppercase">
                                    <Icons.Plus /> Load Extra PDFS
                                    <input type="file" multiple accept="application/pdf" className="hidden" onChange={handleLocalUpload} />
                                </label>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto px-2 pb-24 custom-scrollbar">
                                <div className="flex justify-between items-center px-4 py-2">
                                    <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Manuals ({filteredMachines.length})</h3>
                                    {isLoading && <Icons.Refresh />}
                                </div>
                                
                                {error && (
                                    <div className="mx-2 mb-4 p-3 bg-red-900/20 border border-red-900/50 rounded-lg text-[10px] text-red-200 leading-tight">
                                        {error}
                                        <button onClick={fetchFiles} className="block mt-2 font-bold text-red-400 uppercase">Retry Sync</button>
                                    </div>
                                )}

                                {filteredMachines.map(machine => (
                                    <button key={machine.id} onClick={() => handleSelectMachine(machine)} className={`w-full text-left p-4 rounded-xl mb-1 flex items-center justify-between transition-all active:scale-[0.98] ${selectedMachine?.id === machine.id ? 'bg-red-600 text-white shadow-lg shadow-red-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}`}>
                                        <div className="flex items-center gap-3 min-w-0 shrink-0 flex-1">
                                            <Icons.FileText className={selectedMachine?.id === machine.id ? 'text-white' : (machine.type === 'local' ? 'text-blue-400' : 'text-slate-600')} />
                                            <span className="font-medium text-sm truncate">{machine.name}</span>
                                        </div>
                                        <Icons.ChevronRight className="shrink-0" />
                                    </button>
                                ))}
                            </div>
                        </aside>

                        <main className="flex-1 bg-slate-950 flex flex-col relative overflow-hidden">
                            {selectedMachine ? (
                                <>
                                    <div className="flex-1 w-full bg-slate-800 relative">
                                        <iframe key={`${selectedMachine.id}-${pdfPage}`} src={pdfUrl} className="w-full h-full" title="PDF Viewer" />
                                        
                                        {/* Overlay controls for easier navigation if iframe blocks input */}
                                        <div className="absolute top-4 right-4 flex flex-col gap-2">
                                            <a 
                                                href={selectedMachine.rawUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer" 
                                                className="bg-slate-900/90 p-3 rounded-full hover:bg-slate-900 transition-colors shadow-2xl border border-slate-700 flex items-center justify-center" 
                                                title="Open Raw PDF in new tab (Fixes 404)"
                                            >
                                                <Icons.ExternalLink />
                                            </a>
                                        </div>

                                        {/* 404 Rescue Message (appears behind iframe if it's transparent or fails) */}
                                        <div className="absolute inset-0 -z-10 flex flex-col items-center justify-center p-6 text-center">
                                            <Icons.AlertCircle />
                                            <p className="mt-4 text-slate-400 text-sm font-medium">If you see a 404 above, GitHub is still syncing.</p>
                                            <a 
                                                href={selectedMachine.rawUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="mt-4 bg-red-600 text-white px-6 py-2 rounded-lg font-bold text-xs uppercase tracking-widest shadow-xl"
                                            >
                                                Open Direct PDF
                                            </a>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900/90 backdrop-blur-md border-t border-slate-800 p-4 flex gap-3 shadow-lg shrink-0">
                                        <button onClick={() => jumpToPage(10)} className="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white py-4 rounded-xl flex items-center justify-center gap-2 font-bold text-[10px] uppercase transition-all active:scale-95">
                                            <Icons.BookOpen /> Exploded View
                                        </button>
                                        <button onClick={() => jumpToPage(25)} className="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white py-4 rounded-xl flex items-center justify-center gap-2 font-bold text-[10px] uppercase transition-all active:scale-95">
                                            <Icons.Zap className="text-yellow-400 w-4 h-4" /> Wiring Map
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center p-12 text-center">
                                    <div className="w-24 h-24 bg-slate-900/50 rounded-full flex items-center justify-center mb-6 border border-slate-800/50 shadow-inner">
                                        <Icons.BookOpen className="w-10 h-10 text-slate-700" />
                                    </div>
                                    <h2 className="text-2xl font-black text-slate-200 mb-3 tracking-tight uppercase tracking-widest">Ellis Coffee</h2>
                                    <p className="max-w-[280px] text-sm text-slate-500 leading-relaxed font-medium">
                                        Select a manual to start. If the list is empty, tap "Retry Sync" in the sidebar.
                                    </p>
                                    {!isMenuOpen && <button onClick={() => setIsMenuOpen(true)} className="mt-8 bg-red-600 hover:bg-red-500 text-white px-10 py-3 rounded-full font-bold text-sm shadow-xl transition-all active:scale-95 uppercase tracking-widest">Open List</button>}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
