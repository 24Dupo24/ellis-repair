<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ellis Technician Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap');
        
        :root { --app-height: 100dvh; }
        body, html { 
            height: var(--app-height);
            margin: 0; 
            overflow: hidden; 
            background-color: #000000; 
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        #root { height: 100%; display: flex; flex-direction: column; }
        iframe { background-color: #000000; border: none; width: 100%; height: 100%; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        
        .logo-shine { position: relative; overflow: hidden; }
        .logo-shine::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg);
            animation: shine 6s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .sidebar-item-active {
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .master-btn-highlight {
            background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(12, 12, 12, 0.98);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .nav-icon-stack {
            @apply flex flex-col items-center justify-center gap-1 px-4 py-1 text-slate-400/70 hover:text-white transition-all active:scale-95 cursor-pointer;
        }

        .bottom-nav-active { color: #ef4444 !important; opacity: 1 !important; }
        .bottom-nav-active::after {
            content: '';
            position: absolute;
            top: -1px; left: 30%; right: 30%; height: 2px;
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        .status-dot-mini {
            width: 4px; height: 4px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
            animation: pulse-green 3s infinite;
        }
        @keyframes pulse-green {
            0%, 100% { opacity: 1; transform: scale(1); } 
            50% { opacity: 0.4; transform: scale(0.9); } 
        }

        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 12px); }

        .tech-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            opacity: 0.5;
            text-align: center;
            display: block;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        const GITHUB_USERNAME = "24Dupo24"; 
        const REPO_NAME = "ellis-repair"; 
        const BASE_PDF_PATH = "work"; 
        const LOGO_URL = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/images/ellis-coffee-logo.png`; 
        const USER_EMAIL = "dupo24@gmail.com";

        const Icons = {
            Search: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Folder: (props) => <svg className={`w-4 h-4 ${props.className}`} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>,
            Phone: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 .8 2.81 2 2 0 0 1 22 16.92z"/></svg>,
            Globe: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
            Envelope: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>,
            Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>,
            Book: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Menu: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            X: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            ChevronDown: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>,
            ChevronRight: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>,
            ChevronLeft: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>,
            Star: () => <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>,
            Sync: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>,
            Sparkles: (props) => <svg className={`w-6 h-6 ${props.className || 'text-purple-400'}`} fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 1 1.275-1.275L12 3Z"/></svg>,
            External: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        };

        const App = () => {
            const [manuals, setManuals] = useState([]);
            const [viewMode, setViewMode] = useState('manual');
            const [selectedManual, setSelectedManual] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isMenuOpen, setIsMenuOpen] = useState(false); 
            const [expandedBrands, setExpandedBrands] = useState({}); 
            const [isLoading, setIsLoading] = useState(true);

            const handleHome = () => { setSelectedManual(null); setViewMode('manual'); setIsMenuOpen(false); };
            const handleManualSelect = (m) => { setSelectedManual(m); setViewMode('manual'); if (window.innerWidth < 768) setIsMenuOpen(false); };
            const toggleBrand = (brandName) => { setExpandedBrands(prev => ({ ...prev, [brandName]: !prev[brandName] })); };

            const getBrandInfo = (name) => {
                const n = name.toUpperCase();
                if (n.includes('BUNN')) return { label: 'BUNN', color: 'bg-red-500/10 text-red-400 border-red-500/20', icon: 'B' };
                if (n.includes('SIMONELLI')) return { label: 'SIMONELLI', color: 'bg-blue-600/10 text-blue-400 border-blue-600/20', icon: 'S' };
                if (n.includes('CURTIS')) return { label: 'CURTIS', color: 'bg-amber-500/10 text-amber-400 border-amber-500/20', icon: 'C' };
                if (n.includes('FETCO')) return { label: 'FETCO', color: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20', icon: 'F' };
                if (n.includes('NEWCO') || n.includes('BISTRO')) return { label: 'NEWCO', color: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20', icon: 'N' };
                if (n.includes('GRINDMASTER')) return { label: 'GRINDMASTER', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', icon: 'G' };
                if (n.includes('CECILWARE')) return { label: 'CECILWARE', color: 'bg-orange-500/10 text-orange-400 border-orange-500/20', icon: 'CW' };
                if (n.includes('CORNELIUS')) return { label: 'CORNELIUS', color: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20', icon: 'CO' };
                if (n.includes('EVOCA')) return { label: 'EVOCA', color: 'bg-purple-500/10 text-purple-400 border-purple-500/20', icon: 'E' };
                if (n.includes('FLAVIA')) return { label: 'FLAVIA', color: 'bg-pink-500/10 text-pink-400 border-pink-500/20', icon: 'FL' };
                return { label: 'GENERAL TECHNICAL', color: 'bg-slate-500/10 text-slate-400 border-slate-500/20', icon: 'T' };
            };

            const fetchManuals = async () => {
                setIsLoading(true);
                try {
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${BASE_PDF_PATH}`);
                    if (!res.ok) throw new Error("Sync failure.");
                    const data = await res.json();
                    const pdfs = data.filter(f => f.name.toLowerCase().endsWith('.pdf')).map(f => {
                        const rawName = f.name.replace('.pdf', '').replace(/_/g, ' ');
                        const lowerName = f.name.toLowerCase();
                        const isMaster = lowerName.includes('parts list complete') || (lowerName.includes('ellis') && lowerName.includes('parts'));
                        return {
                            id: f.sha, name: rawName, file: f.name,
                            url: `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/${BASE_PDF_PATH}/${f.name}`,
                            brand: getBrandInfo(rawName), isMaster
                        };
                    });
                    setManuals(pdfs);
                } catch (e) { console.error(e); } finally { setIsLoading(false); }
            };

            useEffect(() => { fetchManuals(); }, []);
            const masterManual = useMemo(() => manuals.find(m => m.isMaster), [manuals]);
            const groupedManuals = useMemo(() => {
                const groups = {};
                const filtered = manuals.filter(m => !m.isMaster && m.name.toLowerCase().includes(searchQuery.toLowerCase()));
                filtered.forEach(m => {
                    const groupName = m.brand.label;
                    if (!groups[groupName]) groups[groupName] = [];
                    groups[groupName].push(m);
                });
                return Object.keys(groups).sort().map(name => ({ name, items: groups[name] }));
            }, [manuals, searchQuery]);

            const sendEmail = () => {
                const subject = `[Technical Hub] ${selectedManual?.name || 'Manual Request'}`;
                const body = `Documentation Reference:\n\nManual: ${selectedManual?.name || 'Technical Manual'}\nView: ${selectedManual?.url || 'https://24dupo24.github.io/ellis-repair/'}`;
                window.location.href = `mailto:${USER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            };

            const techSupport = [
                { name: "Grindmaster Tech Support", phone: "1-800-695-4500", brand: "GRINDMASTER" },
                { name: "Bunn Technical Service", phone: "1-800-637-8606", brand: "BUNN" },
                { name: "Curtis Technical Support", phone: "1-800-421-6150", brand: "CURTIS" },
                { name: "Nuova Simonelli Engineering", phone: "360-366-2226", brand: "SIMONELLI" },
                { name: "Newco Support Center", phone: "1-800-325-7867", brand: "NEWCO" },
                { name: "Fetco Manufacturing", phone: "1-800-338-2699", brand: "FETCO" },
                { name: "Cecilware Engineering", phone: "1-800-935-2211", brand: "CECILWARE" }
            ];

            return (
                <div className="flex flex-col h-full bg-black text-white overflow-hidden">
                    {/* Header */}
                    <header className="bg-[#080808] border-b border-white/5 px-4 py-2 flex justify-between items-center z-50 shrink-0">
                        <div className="flex items-center gap-12">
                            <div className="logo-shine h-9 sm:h-12 cursor-pointer shrink-0" onClick={handleHome}>
                                <img src={LOGO_URL} alt="Ellis Coffee" className="h-full w-auto" />
                            </div>
                            
                            <div className="hidden md:flex items-center gap-2">
                                <button onClick={handleHome} className="nav-icon-stack">
                                    <Icons.Home /><span className="tech-label">Home</span>
                                </button>
                                <button onClick={() => setViewMode('directory')} className="nav-icon-stack">
                                    <Icons.Phone /><span className="tech-label">Support</span>
                                </button>
                                <button onClick={() => window.open('https://elliscoffee.com', '_blank')} className="nav-icon-stack">
                                    <Icons.Globe /><span className="tech-label">Ellis</span>
                                </button>
                                <button onClick={sendEmail} className="nav-icon-stack">
                                    <Icons.Envelope /><span className="tech-label">Upload</span>
                                </button>
                                <button onClick={fetchManuals} className="nav-icon-stack">
                                    <Icons.Sync /><span className="tech-label">Refresh</span>
                                </button>
                                <button onClick={() => window.open('https://gemini.google.com', '_blank')} className="nav-icon-stack">
                                    <Icons.Sparkles /><span className="tech-label text-purple-400/60">AI Hub</span>
                                </button>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-3 text-slate-400 hover:text-white transition-all bg-white/[0.03] rounded-xl border border-white/5">
                                {isMenuOpen ? <Icons.X /> : <Icons.Menu />}
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        <aside className={`fixed inset-0 z-40 bg-black transition-transform duration-300 transform ${isMenuOpen ? 'translate-x-0' : '-translate-x-full md:relative md:translate-x-0 md:w-80'} border-r border-white/5 flex flex-col`}>
                            
                            <div className="p-4 bg-[#080808] border-b border-white/5">
                                {masterManual ? (
                                    <button 
                                        onClick={() => { handleManualSelect(masterManual); }}
                                        className={`w-full py-2.5 px-4 rounded-xl flex items-center justify-between transition-all active:scale-95 ${selectedManual?.id === masterManual.id ? 'master-btn-highlight ring-1 ring-red-600 shadow-xl' : 'master-btn-highlight opacity-80 hover:opacity-100 hover:scale-[1.01]'}`}
                                    >
                                        <div className="flex items-center gap-3 min-w-0">
                                            <div className="bg-white/10 p-1.5 rounded-lg text-white"><Icons.Star /></div>
                                            <span className="text-[10px] font-black uppercase tracking-[0.1em] text-white truncate">Ellis Parts List</span>
                                        </div>
                                        <div className="status-dot-mini bg-white/30 animate-none"></div>
                                    </button>
                                ) : (
                                    <div className="p-3 rounded-xl bg-white/5 border border-white/10 text-center opacity-30"><p className="text-[8px] font-black uppercase tracking-[0.2em] animate-pulse">Syncing...</p></div>
                                )}
                            </div>

                            <div className="p-4 bg-[#080808] border-b border-white/5">
                                <div className="relative group">
                                    <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-700 group-focus-within:text-red-600 transition-colors"><Icons.Search /></div>
                                    <input type="text" placeholder="Scan technical library..." className="w-full bg-white/[0.02] border border-white/10 rounded-xl py-3 pl-11 pr-4 text-xs focus:ring-1 focus:ring-red-600 outline-none placeholder:text-slate-800 tech-label text-left opacity-100" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto px-2 pb-32 custom-scrollbar mt-2">
                                {isLoading ? (
                                    <div className="p-10 text-center opacity-20 text-[9px] font-black uppercase tracking-widest">Initialising Core...</div>
                                ) : groupedManuals.map(group => (
                                    <div key={group.name} className="mb-4 px-1">
                                        <button onClick={() => toggleBrand(group.name)} className="w-full flex items-center justify-between px-3 py-1.5 text-[9px] font-black tracking-[0.25em] text-slate-600 uppercase hover:text-slate-400 transition-colors">
                                            <div className="flex items-center gap-2.5"><Icons.Folder className={expandedBrands[group.name] ? 'text-red-700' : 'text-slate-800'} /><span>{group.name}</span></div>
                                            {expandedBrands[group.name] ? <Icons.ChevronDown /> : <Icons.ChevronRight />}
                                        </button>
                                        {expandedBrands[group.name] && (
                                            <div className="mt-2 space-y-1 ml-2">
                                                {group.items.map(m => (
                                                    <button key={m.id} onClick={() => { handleManualSelect(m); }} className={`w-full text-left p-3.5 rounded-xl flex items-center justify-between group transition-all ${selectedManual?.id === m.id ? 'sidebar-item-active' : 'hover:bg-white/[0.03]'}`}>
                                                        <div className="flex items-center gap-3.5 min-w-0">
                                                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-[10px] font-black shrink-0 ${selectedManual?.id === m.id ? 'bg-white/20 text-white' : m.brand.color}`}>{m.brand.icon}</div>
                                                            <span className={`font-bold text-[11px] truncate uppercase tracking-tight ${selectedManual?.id === m.id ? 'text-white' : 'text-slate-500 group-hover:text-slate-300'}`}>{m.name}</span>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="p-5 border-t border-white/5 flex items-center justify-between shrink-0 bg-[#050505]">
                                <p className="text-[9px] font-black uppercase tracking-[0.3em] text-slate-700 italic">© 2026 John Patton</p>
                                <div className="flex items-center gap-2.5 bg-emerald-500/5 px-3 py-1 rounded-full border border-emerald-500/10">
                                    <span className="status-dot-mini"></span>
                                    <span className="text-[8px] font-black uppercase tracking-[0.1em] text-emerald-500/40">Active</span>
                                </div>
                            </div>
                        </aside>

                        <main className="flex-1 bg-black relative flex flex-col overflow-hidden">
                            {viewMode === 'directory' ? (
                                <div className="flex-1 overflow-y-auto p-4 sm:p-12 bg-black pb-32 custom-scrollbar text-left">
                                    <div className="max-w-3xl mx-auto space-y-4">
                                        <div className="flex items-center gap-6 mb-12 border-b border-white/5 pb-12">
                                            <div className="bg-red-700 p-6 rounded-2xl shadow-2xl shadow-red-900/40"><Icons.Phone /></div>
                                            <div><h2 className="text-4xl font-black uppercase tracking-[0.15em] leading-none text-white">Engineering Line</h2><p className="text-[10px] text-slate-600 font-bold mt-4 uppercase tracking-[0.2em] leading-relaxed">Direct manufacturer technical engineering support.</p></div>
                                        </div>
                                        {techSupport.map((contact, idx) => (
                                            <div key={idx} className="glass-panel border border-white/5 p-8 rounded-2xl flex items-center justify-between hover:border-white/10 transition-all hover:scale-[1.01] shadow-xl">
                                                <div className="min-w-0 pr-6">
                                                    <span className={`brand-pill border ${getBrandInfo(contact.brand).color}`}>{contact.brand}</span>
                                                    <h4 className="text-base font-black mt-4 text-slate-200 tracking-tight">{contact.name}</h4>
                                                </div>
                                                <a href={`tel:${contact.phone}`} className="bg-white/[0.03] hover:bg-emerald-700 px-8 py-4 rounded-xl font-black text-[11px] transition-all flex items-center gap-3 border border-white/5 active:scale-95 shadow-lg uppercase tracking-widest"><Icons.Phone /> <span className="hidden sm:inline">{contact.phone}</span></a>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : selectedManual ? (
                                <div className="flex-1 flex flex-col relative">
                                    <iframe key={selectedManual.id} src={`https://docs.google.com/viewer?url=${encodeURIComponent(selectedManual.url)}&embedded=true`} className="flex-1" />
                                    <button onClick={() => { setSelectedManual(null); }} className="md:hidden absolute top-5 left-5 z-50 bg-red-700 w-12 h-12 rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition-transform border border-white/10"><Icons.ChevronLeft className="text-white"/></button>
                                    <div className="absolute top-5 right-5 flex flex-col gap-4">
                                        <a href={selectedManual.url} target="_blank" className="bg-red-700 p-4 rounded-xl border border-red-600 shadow-2xl active:scale-90 flex items-center justify-center transition-all hover:bg-red-600" title="Open Engineering File"><Icons.External /></a>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center p-12 text-center bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-900/10 via-black to-black">
                                    <div className="w-24 h-24 bg-white/[0.02] rounded-3xl flex items-center justify-center mb-12 logo-shine border border-white/5 shadow-2xl p-5">
                                        <img src={LOGO_URL} alt="Ellis" className="w-full h-full object-contain opacity-50" />
                                    </div>
                                    <h2 className="text-4xl font-black text-white mb-4 tracking-[0.5em] uppercase opacity-90 leading-none">Ellis Technician Hub</h2>
                                    <p className="max-w-[400px] text-[11px] text-slate-700 font-bold uppercase tracking-[0.4em] mt-3 leading-relaxed text-center italic opacity-60">Ellis Coffee Technical Manuals</p>
                                    
                                    {/* Mobile Only Access Button */}
                                    {!isMenuOpen && (
                                        <button 
                                            onClick={() => setIsMenuOpen(true)} 
                                            className="md:hidden mt-16 bg-red-700 px-16 py-5 rounded-full font-black text-[10px] uppercase tracking-[0.3em] active:scale-95 shadow-2xl shadow-red-950/20 transition-all hover:bg-red-600 hover:translate-y-[-2px] border border-white/5"
                                        >
                                            Access Library
                                        </button>
                                    )}
                                </div>
                            )}
                        </main>

                        <nav className="md:hidden fixed bottom-0 left-0 right-0 h-20 glass-panel flex items-center justify-around px-3 z-[60] safe-bottom shadow-[0_-10px_40px_rgba(0,0,0,0.8)] border-t border-white/5">
                            <button onClick={handleHome} className={`nav-icon-stack flex-1 py-3 ${viewMode === 'manual' && !selectedManual && !isMenuOpen ? 'bottom-nav-active' : 'text-slate-600'}`}>
                                <Icons.Home />
                                <span className="tech-label text-[7px]">Base</span>
                            </button>
                            <button onClick={() => { setViewMode('manual'); setIsMenuOpen(true); }} className={`nav-icon-stack flex-1 py-3 ${isMenuOpen ? 'bottom-nav-active' : 'text-slate-600'}`}>
                                <Icons.Book />
                                <span className="tech-label text-[7px]">Library</span>
                            </button>
                            <button onClick={() => { setViewMode('directory'); setSelectedManual(null); setIsMenuOpen(false); }} className={`nav-icon-stack flex-1 py-3 ${viewMode === 'directory' ? 'bottom-nav-active' : 'text-slate-600'}`}>
                                <Icons.Phone />
                                <span className="tech-label text-[7px]">Support</span>
                            </button>
                            <button onClick={() => window.open('https://gemini.google.com', '_blank')} className="nav-icon-stack flex-1 py-3 text-purple-600/50 transition-all">
                                <Icons.Sparkles className="text-purple-600/60" />
                                <span className="tech-label text-[7px]">AI Hub</span>
                            </button>
                        </nav>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
