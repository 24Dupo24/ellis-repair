<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ellis Coffee Part Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body, html { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            background-color: #020617; 
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        iframe { 
            background-color: #0f172a; 
            border: none; 
            width: 100%; 
            height: 100%; 
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .pdf-container { position: relative; height: 100%; width: 100%; overflow: hidden; }

        .brand-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            padding: 1px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .logo-shine {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .logo-shine::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .sidebar-item-active {
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // --- CONFIGURATION ---
        const GITHUB_USERNAME = "24Dupo24"; 
        const REPO_NAME = "ellis-repair"; 
        const BASE_PDF_PATH = "work"; 
        const LOGO_URL = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/images/ellis-coffee-logo.png`; 

        const Icon = ({ path, className = "w-4 h-4", fill = "none", strokeWidth = "2.5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                {path}
            </svg>
        );

        const Icons = {
            Search: () => <Icon path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Zap: (props) => <Icon {...props} fill="currentColor" path={<path d="M13 2 L3 14 h9 l-1 8 10-12 h-9 l1-8z"/>} />,
            Menu: () => <Icon path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />,
            X: () => <Icon path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />,
            ChevronRight: (props) => <Icon {...props} className="w-3 h-3 opacity-30" path={<path d="m9 18 6-6-6-6"/>} />,
            FileText: (props) => <Icon {...props} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></>} />,
            Refresh: () => <Icon className="w-3 h-3 animate-spin text-slate-500" path={<><path d="M21 12a9 9 0 1 1-6.219-8.56"/><path d="M22 2v6h-6"/></>} />,
            ExternalLink: () => <Icon className="w-4 h-4" path={<><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>} />,
            Cpu: () => <Icon className="w-3 h-3" path={<><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="15" x2="23" y2="15"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="15" x2="4" y2="15"/></>} />,
            Home: (props) => <Icon {...props} path={<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />} />,
            Globe: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>} />
        };

        const getBrandInfo = (name) => {
            const n = name.toUpperCase();
            if (n.includes('BUNN')) return { label: 'BUNN', color: 'bg-red-500/10 text-red-400 border-red-500/20' };
            if (n.includes('CURTIS')) return { label: 'CURTIS', color: 'bg-amber-500/10 text-amber-400 border-amber-500/20' };
            if (n.includes('FETCO')) return { label: 'FETCO', color: 'bg-blue-500/10 text-blue-400 border-blue-500/20' };
            if (n.includes('GRIND')) return { label: 'GRINDMASTER', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' };
            if (n.includes('SIMONELLI')) return { label: 'SIMONELLI', color: 'bg-sky-500/10 text-sky-400 border-sky-500/20' };
            if (n.includes('NEWCO') || n.includes('BISTRO')) return { label: 'NEWCO', color: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20' };
            if (n.includes('FLAVIA')) return { label: 'FLAVIA', color: 'bg-fuchsia-500/10 text-fuchsia-400 border-fuchsia-500/20' };
            if (n.includes('EVOCA')) return { label: 'EVOCA', color: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20' };
            if (n.includes('CECILWARE')) return { label: 'CECILWARE', color: 'bg-orange-500/10 text-orange-400 border-orange-500/20' };
            if (n.includes('CORNELIUS')) return { label: 'CORNELIUS', color: 'bg-lime-500/10 text-lime-400 border-lime-500/20' };
            return { label: 'OEM PART', color: 'bg-slate-500/10 text-slate-400 border-slate-500/20' };
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMachine, setSelectedMachine] = useState(null);
            
            // Set default sidebar state: 
            // Closed by default on mobile/small screens (< 768px)
            // Open by default on larger desktop screens
            const [isMenuOpen, setIsMenuOpen] = useState(window.innerWidth >= 768);
            
            const [pdfPage, setPdfPage] = useState(1);
            const [refreshKey, setRefreshKey] = useState(0); 
            const [machines, setMachines] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                const handlePopState = () => {
                    if (selectedMachine) {
                        setSelectedMachine(null);
                        setPdfPage(1);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [selectedMachine]);

            const fetchFiles = async () => {
                setIsLoading(true);
                setError(null);
                try {
                    const apiURL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${BASE_PDF_PATH}?t=${Date.now()}`;
                    const response = await fetch(apiURL);
                    
                    if (response.ok) {
                        const data = await response.json();
                        const pdfList = data
                            .filter(file => file.name.toLowerCase().endsWith('.pdf'))
                            .map((file, index) => {
                                const viewerUrl = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/${BASE_PDF_PATH}/${encodeURIComponent(file.name)}`;
                                return {
                                    id: `gh-${index}`,
                                    name: file.name.replace(/_/g, ' ').replace('.pdf', ''),
                                    file: file.name,
                                    type: 'github',
                                    url: viewerUrl,
                                    brand: getBrandInfo(file.name)
                                };
                            });
                        setMachines(pdfList);
                    } else {
                        throw new Error(`Cloud folder not found.`);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchFiles();
            }, []);

            const filteredMachines = useMemo(() => {
                return machines
                    .filter(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()))
                    .sort((a, b) => {
                        const brandA = a.brand.label.toUpperCase();
                        const brandB = b.brand.label.toUpperCase();
                        if (brandA < brandB) return -1;
                        if (brandA > brandB) return 1;
                        const nameA = a.name.toUpperCase();
                        const nameB = b.name.toUpperCase();
                        if (nameA < nameB) return -1;
                        if (nameA > nameB) return 1;
                        return 0;
                    });
            }, [searchQuery, machines]);

            const handleSelectMachine = (machine) => {
                setSelectedMachine(machine);
                setPdfPage(1);
                window.history.pushState({ view: 'manual' }, '');
                if (window.innerWidth < 768) {
                    setIsMenuOpen(false);
                }
            };

            const handleHome = () => {
                if (selectedMachine) {
                    setSelectedMachine(null);
                    setPdfPage(1);
                    if (window.history.state?.view === 'manual') {
                        window.history.back();
                    }
                } else if (window.innerWidth < 768) {
                    setIsMenuOpen(false);
                }
            };

            const resetManual = () => {
                setPdfPage(1);
                setRefreshKey(prev => prev + 1); 
            };

            const pdfUrl = selectedMachine 
                ? `${selectedMachine.url}#page=${pdfPage}&t=${refreshKey}`
                : null;

            return (
                <div className="flex flex-col h-screen bg-slate-950 text-white font-sans overflow-hidden">
                    <header className="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center z-50 shadow-xl shrink-0">
                        <div className="flex items-center gap-2">
                            <button onClick={handleHome} className="p-2 hover:bg-slate-800 rounded-lg transition-colors text-slate-400 hover:text-red-500 active:scale-90" title="Clear Viewer">
                                <Icons.Home className="w-5 h-5" />
                            </button>
                            <a href="https://www.elliscoffee.com" target="_blank" rel="noopener noreferrer" className="p-2 hover:bg-slate-800 rounded-lg transition-colors text-slate-400 hover:text-blue-400" title="Ellis Official Site">
                                <Icons.Globe className="w-5 h-5" />
                            </a>
                            <div className="h-6 w-[1px] bg-slate-800 mx-1"></div>
                            <div className="logo-shine h-10 w-auto flex items-center cursor-pointer" onClick={handleHome}>
                                <img src={LOGO_URL} alt="Ellis Coffee" className="h-full w-auto object-contain max-w-[120px]" />
                            </div>
                        </div>
                        <button 
                            onClick={() => setIsMenuOpen(!isMenuOpen)} 
                            className="p-2 hover:bg-slate-800 rounded-lg transition-all border border-transparent hover:border-slate-700 active:scale-95 text-slate-400 hover:text-white"
                        >
                            {isMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}
                        </button>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        <aside className={`
                            fixed inset-0 z-40 bg-slate-950 transition-all duration-300 ease-in-out transform
                            ${isMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
                            md:relative md:flex md:flex-col
                            ${isMenuOpen ? 'md:w-72 md:border-r' : 'md:w-0 md:opacity-0 md:pointer-events-none md:border-none'}
                            border-slate-900 flex flex-col shadow-2xl md:shadow-none overflow-hidden
                        `}>
                            <div className="p-4 space-y-3 bg-slate-950/50 backdrop-blur-sm shrink-0">
                                <div className="relative group">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 group-focus-within:text-red-500 transition-colors"><Icons.Search /></div>
                                    <input
                                        type="text"
                                        placeholder="Search manuals..."
                                        className="w-full bg-slate-900 border border-slate-800 rounded-lg py-2.5 pl-9 pr-4 focus:outline-none focus:ring-1 focus:ring-red-500/50 text-xs transition-all placeholder:text-slate-600 shadow-inner"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto px-2 pb-4 custom-scrollbar">
                                <div className="flex justify-between items-center px-4 py-2">
                                    <h3 className="text-[9px] font-black text-slate-600 uppercase tracking-[0.2em]">Inventory ({filteredMachines.length})</h3>
                                    {isLoading && <Icons.Refresh className="w-3 h-3 animate-spin text-slate-500" />}
                                </div>
                                
                                {filteredMachines.map(machine => (
                                    <button 
                                        key={machine.id} 
                                        onClick={() => handleSelectMachine(machine)} 
                                        className={`w-full text-left p-3 rounded-lg mb-1 flex items-center justify-between transition-all group ${selectedMachine?.id === machine.id ? 'sidebar-item-active shadow-lg shadow-red-900/20' : 'hover:bg-slate-900/50'}`}
                                    >
                                        <div className="flex flex-col gap-1.5 min-w-0 flex-1 pr-2">
                                            <div className="flex items-center gap-2">
                                                <Icons.FileText className={selectedMachine?.id === machine.id ? 'text-white w-3.5 h-3.5' : 'text-slate-700 w-3.5 h-3.5 group-hover:text-slate-500'} />
                                                <span className={`font-bold text-[11px] truncate uppercase tracking-tight ${selectedMachine?.id === machine.id ? 'text-white' : 'text-slate-400 group-hover:text-slate-200'}`}>
                                                    {machine.name}
                                                </span>
                                            </div>
                                            <div className="flex items-center gap-2 pl-5">
                                                <span className={`brand-badge border ${selectedMachine?.id === machine.id ? 'bg-white/20 border-white/20 text-white font-black' : machine.brand.color}`}>
                                                    {machine.brand.label}
                                                </span>
                                            </div>
                                        </div>
                                        <Icons.ChevronRight className={selectedMachine?.id === machine.id ? 'text-white opacity-100' : 'text-slate-800'} />
                                    </button>
                                ))}
                            </div>

                            <div className="mt-auto p-3 bg-slate-900/80 border-t border-slate-800/50 flex items-center justify-between text-[8px] font-black tracking-widest text-slate-500 uppercase shrink-0">
                                <div className="flex items-center gap-2">
                                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                                    <span>Cloud Active</span>
                                </div>
                                <div className="flex items-center gap-1.5"><Icons.Cpu /><span>v1.2.6-PRO</span></div>
                            </div>
                        </aside>

                        <main className="flex-1 bg-black flex flex-col relative overflow-hidden transition-all duration-300">
                            {selectedMachine ? (
                                <>
                                    <div className="flex-1 w-full bg-slate-900 relative">
                                        <div className="pdf-container">
                                            <iframe 
                                                key={`${selectedMachine.id}-${refreshKey}`} 
                                                src={pdfUrl} 
                                                title="Repair Manual" 
                                                type="application/pdf"
                                            />
                                        </div>
                                        <div className="absolute top-4 right-4 flex flex-col gap-2">
                                            <a href={selectedMachine.url} target="_blank" rel="noopener noreferrer" className="bg-slate-900/90 p-2.5 rounded-lg hover:bg-red-600 transition-colors shadow-2xl border border-slate-700 flex items-center justify-center text-white active:scale-95">
                                                <Icons.ExternalLink />
                                            </a>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 border-t border-slate-800 p-2 flex gap-2 shadow-2xl shrink-0">
                                        <button onClick={resetManual} className="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white py-4 px-2 rounded-xl flex items-center justify-center gap-2 font-black text-[10px] uppercase tracking-widest transition-all active:scale-95 shadow-lg">
                                            <Icons.Refresh className="w-3.5 h-3.5" /> Reload Manual
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center p-12 text-center bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-900 via-black to-black">
                                    <div className="w-24 h-24 bg-slate-900 rounded-2xl flex items-center justify-center mb-6 border border-slate-800 shadow-2xl shadow-red-900/10 p-4">
                                        <img src={LOGO_URL} alt="Ellis Coffee Logo" className="w-full h-full object-contain opacity-40" />
                                    </div>
                                    <h2 className="text-lg font-black text-slate-400 mb-2 tracking-[0.3em] uppercase tracking-widest">Ready for Service</h2>
                                    <p className="max-w-[240px] text-[10px] text-slate-600 leading-relaxed font-bold uppercase tracking-widest leading-relaxed">Select a manual to begin repair.</p>
                                    {!isMenuOpen && (
                                        <button onClick={() => setIsMenuOpen(true)} className="mt-8 bg-red-600 hover:bg-red-500 text-white px-10 py-3 rounded-lg font-black text-[10px] shadow-xl transition-all active:scale-95 uppercase tracking-widest">Open Inventory</button>
                                    )}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
