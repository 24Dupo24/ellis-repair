<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ellis Coffee Part Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body, html { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            background-color: #000000; 
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        iframe { 
            background-color: #000000; 
            border: none; 
            width: 100%; 
            height: 100%; 
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        .pdf-container { position: relative; height: 100%; width: 100%; overflow: hidden; }

        .brand-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            padding: 1px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .logo-shine {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .logo-shine::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .sidebar-item-active {
            background: linear-gradient(90deg, #dc2626 0%, #7f1d1d 100%);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
        }

        .ai-glow {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.1);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .viewer-frame {
            border: 0;
            width: 100%;
            height: 100%;
        }

        .bottom-nav-active {
            color: #ef4444;
        }
        .bottom-nav-active::after {
            content: '';
            position: absolute;
            top: -2px;
            left: 25%;
            right: 25%;
            height: 2px;
            background: #ef4444;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // --- CONFIGURATION ---
        const GITHUB_USERNAME = "24Dupo24"; 
        const REPO_NAME = "ellis-repair"; 
        const BASE_PDF_PATH = "work"; 
        const LOGO_URL = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/images/ellis-coffee-logo.png`; 

        const Icon = ({ path, className = "w-4 h-4", fill = "none", strokeWidth = "2.5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                {path}
            </svg>
        );

        const Icons = {
            Search: () => <Icon path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Zap: (props) => <Icon {...props} fill="currentColor" path={<path d="M13 2 L3 14 h9 l-1 8 10-12 h-9 l1-8z"/>} />,
            Menu: () => <Icon path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />,
            X: () => <Icon path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />,
            ChevronDown: (props) => <Icon {...props} className="w-3 h-3" path={<path d="m6 9 6 6 6-6"/>} />,
            ChevronRight: (props) => <Icon {...props} className="w-3 h-3" path={<path d="m9 18 6-6-6-6"/>} />,
            FileText: (props) => <Icon {...props} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></>} />,
            RotateCw: (props) => <Icon {...props} path={<><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>} />,
            ExternalLink: () => <Icon className="w-4 h-4" path={<><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>} />,
            Cpu: () => <Icon className="w-3 h-3" path={<><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="15" x2="23" y2="15"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="15" x2="4" y2="15"/></>} />,
            Home: (props) => <Icon {...props} path={<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />} />,
            Globe: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>} />,
            Phone: (props) => <Icon {...props} path={<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />} />,
            AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Sparkles: (props) => <Icon {...props} path={<path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z" />} />,
            Mail: (props) => <Icon {...props} path={<><path d="m3 7 9 6 9-6M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></>} />,
            Folder: (props) => <Icon {...props} path={<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z" />} />,
            Package: (props) => <Icon {...props} path={<><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></>} />
        };

        const getBrandInfo = (name) => {
            const n = name.toUpperCase();
            if (n.includes('BUNN')) return { label: 'BUNN', color: 'bg-red-500/10 text-red-400 border-red-500/20', icon: 'B' };
            if (n.includes('CURTIS')) return { label: 'CURTIS', color: 'bg-amber-500/10 text-amber-400 border-amber-500/20', icon: 'C' };
            if (n.includes('FETCO')) return { label: 'FETCO', color: 'bg-blue-500/10 text-blue-400 border-blue-500/20', icon: 'F' };
            if (n.includes('GRIND')) return { label: 'GRINDMASTER', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', icon: 'G' };
            if (n.includes('SIMONELLI')) return { label: 'SIMONELLI', color: 'bg-sky-500/10 text-sky-400 border-sky-500/20', icon: 'S' };
            if (n.includes('NEWCO') || n.includes('BISTRO')) return { label: 'NEWCO', color: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20', icon: 'N' };
            if (n.includes('FLAVIA') || n.includes('LAVAZZA')) return { label: 'FLAVIA', color: 'bg-fuchsia-500/10 text-fuchsia-400 border-fuchsia-500/20', icon: 'L' };
            if (n.includes('EVOCA')) return { label: 'EVOCA', color: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20', icon: 'E' };
            if (n.includes('CECILWARE')) return { label: 'CECILWARE', color: 'bg-orange-500/10 text-orange-400 border-orange-500/20', icon: 'CW' };
            if (n.includes('CORNELIUS')) return { label: 'CORNELIUS', color: 'bg-lime-500/10 text-lime-400 border-lime-500/20', icon: 'CR' };
            if (n.includes('HAMILTON')) return { label: 'HAMILTON', color: 'bg-slate-400/10 text-slate-300 border-slate-400/20', icon: 'HB' };
            if (n.includes('NESPRESSO')) return { label: 'NESPRESSO', color: 'bg-stone-500/10 text-stone-400 border-stone-500/20', icon: 'NP' };
            if (n.includes('ROYAL')) return { label: 'ROYAL CUP', color: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20', icon: 'RC' };
            return { label: 'OEM PART', color: 'bg-slate-500/10 text-slate-400 border-slate-500/20', icon: 'P' };
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMachine, setSelectedMachine] = useState(null);
            const [viewMode, setViewMode] = useState('manual'); 
            const [isMenuOpen, setIsMenuOpen] = useState(window.innerWidth >= 768);
            const [refreshKey, setRefreshKey] = useState(0); 
            const [machines, setMachines] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [expandedBrands, setExpandedBrands] = useState({});

            const techSupport = [
                { name: "Grindmaster Support", phone: "1-800-695-4500", brand: "GRINDMASTER" },
                { name: "Bunn Technical Support", phone: "1-800-637-8606", brand: "BUNN" },
                { name: "Curtis Technical Service", phone: "1-800-421-6150", brand: "CURTIS" },
                { name: "Lavazza / Flavia Support", phone: "1-877-273-5812", brand: "FLAVIA" },
                { name: "Fetco Tech Support", phone: "1-800-338-2699", brand: "FETCO" },
                { name: "Gulf Ice / Cornelius", phone: "1-800-322-4853", brand: "CORNELIUS" },
                { name: "Hamilton Beach Support", phone: "1-800-572-3331", brand: "HAMILTON" },
                { name: "Nespresso Support Line", phone: "1-800-566-0571", brand: "NESPRESSO" },
                { name: "Newco Support Team", phone: "1-800-325-7867", brand: "NEWCO" },
                { name: "Royal Cup Support", phone: "1-800-366-5836", brand: "ROYAL" },
                { name: "Nuova Simonelli Support", phone: "360-366-2226", brand: "SIMONELLI" },
            ];

            useEffect(() => {
                const handlePopState = () => {
                    if (selectedMachine || viewMode === 'directory') {
                        setSelectedMachine(null);
                        setViewMode('manual');
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [selectedMachine, viewMode]);

            const fetchFiles = async () => {
                setIsLoading(true);
                try {
                    const apiURL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${BASE_PDF_PATH}?t=${Date.now()}`;
                    const response = await fetch(apiURL);
                    
                    if (response.ok) {
                        const data = await response.json();
                        const pdfList = data
                            .filter(file => file.name.toLowerCase().endsWith('.pdf'))
                            .map((file, index) => {
                                const rawUrl = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/${BASE_PDF_PATH}/${encodeURIComponent(file.name)}`;
                                const isMasterFile = file.name.toLowerCase().replace(/_/g, ' ').includes('ellis parts list complete');
                                
                                return {
                                    id: `gh-${index}`,
                                    name: isMasterFile ? "MASTER STOCK INVENTORY" : file.name.replace(/_/g, ' ').replace('.pdf', ''),
                                    file: file.name,
                                    type: 'github',
                                    url: rawUrl,
                                    brand: isMasterFile 
                                        ? { label: 'STOCK', color: 'bg-red-600 text-white border-red-500 font-black shadow-inner', icon: '★' }
                                        : getBrandInfo(file.name),
                                    isMaster: isMasterFile
                                };
                            });
                        setMachines(pdfList);
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchFiles();
            }, []);

            // Grouping Logic
            const groupedMachines = useMemo(() => {
                const groups = {};
                const filtered = machines.filter(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()));
                
                filtered.forEach(m => {
                    const groupName = m.isMaster ? "MASTER LISTS" : m.brand.label;
                    if (!groups[groupName]) groups[groupName] = [];
                    groups[groupName].push(m);
                });

                return Object.keys(groups).sort((a, b) => {
                    if (a === "MASTER LISTS") return -1;
                    if (b === "MASTER LISTS") return 1;
                    return a.localeCompare(b);
                }).map(name => ({
                    name,
                    items: groups[name].sort((a, b) => a.name.localeCompare(b.name))
                }));
            }, [searchQuery, machines]);

            const handleSelectMachine = (machine) => {
                setSelectedMachine(machine);
                setViewMode('manual');
                window.history.pushState({ view: 'manual' }, '');
                if (window.innerWidth < 768) {
                    setIsMenuOpen(false);
                }
            };

            const handleHome = () => {
                setSelectedMachine(null);
                setViewMode('manual');
                if (window.history.state?.view === 'manual') {
                    window.history.back();
                } else if (window.innerWidth < 768) {
                    setIsMenuOpen(false);
                }
            };

            const toggleBrand = (brandName) => {
                setExpandedBrands(prev => ({
                    ...prev,
                    [brandName]: !prev[brandName]
                }));
            };

            const pdfViewerUrl = selectedMachine 
                ? `https://docs.google.com/viewer?url=${encodeURIComponent(selectedMachine.url)}&embedded=true&refresh=${refreshKey}`
                : null;

            return (
                <div className="flex flex-col h-screen bg-black text-white font-sans overflow-hidden">
                    <header className="bg-[#050505] border-b border-white/5 p-3 flex justify-between items-center z-50 shadow-2xl shrink-0">
                        <div className="flex items-center gap-1.5 sm:gap-2">
                            <div className="logo-shine h-8 sm:h-10 w-auto flex items-center cursor-pointer mr-1 sm:mr-4" onClick={handleHome}>
                                <img src={LOGO_URL} alt="Ellis Coffee" className="h-full w-auto object-contain max-w-[90px] sm:max-w-[120px]" />
                            </div>
                            
                            <div className="hidden sm:flex items-center gap-2">
                                <button onClick={handleHome} className="p-2 hover:bg-white/5 rounded-lg transition-colors text-slate-500 hover:text-red-500 active:scale-90" title="Home">
                                    <Icons.Home className="w-5 h-5" />
                                </button>
                                
                                <button onClick={() => window.location.reload()} className="p-2 hover:bg-white/5 rounded-lg transition-colors text-slate-500 hover:text-red-500 active:rotate-180 transition-transform duration-500" title="Refresh Inventory">
                                    <Icons.RotateCw className="w-5 h-5" />
                                </button>

                                <a href="mailto:jpatton@elliscoffee.com?subject=New PDF Manual for Repair Hub" className="p-2 hover:bg-white/5 rounded-lg transition-colors text-slate-500 hover:text-red-500" title="Submit new PDFs">
                                    <Icons.Mail className="w-5 h-5" />
                                </a>

                                <div className="h-6 w-[1px] bg-white/10 mx-2"></div>
                                
                                <button onClick={() => setViewMode('directory')} className={`p-2 rounded-lg transition-colors ${viewMode === 'directory' ? 'bg-red-600 text-white' : 'text-slate-500 hover:text-red-500'}`} title="Directory">
                                    <Icons.Phone className="w-5 h-5" />
                                </button>
                                <a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer" className="p-2 hover:bg-white/5 rounded-lg transition-colors text-slate-500 hover:text-purple-400 ai-glow" title="Gemini AI">
                                    <Icons.Sparkles className="w-5 h-5" />
                                </a>
                            </div>
                        </div>
                        <button 
                            onClick={() => setIsMenuOpen(!isMenuOpen)} 
                            className="p-2 hover:bg-white/5 rounded-lg transition-all border border-transparent hover:border-white/10 active:scale-95 text-slate-400 hover:text-white"
                        >
                            {isMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}
                        </button>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        <aside className={`
                            fixed inset-0 z-40 bg-black transition-all duration-300 ease-in-out transform
                            ${isMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
                            md:relative md:flex md:flex-col
                            ${isMenuOpen ? 'md:w-80 md:border-r' : 'md:w-0 md:opacity-0 md:pointer-events-none md:border-none'}
                            border-white/5 flex flex-col shadow-2xl md:shadow-none overflow-hidden
                        `}>
                            <div className="p-4 space-y-3 bg-[#050505] shrink-0">
                                <div className="relative group">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-700 group-focus-within:text-red-500 transition-colors"><Icons.Search /></div>
                                    <input
                                        type="text"
                                        placeholder="Quick search..."
                                        className="w-full bg-white/5 border border-white/5 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-1 focus:ring-red-500/50 text-xs transition-all placeholder:text-slate-600 shadow-inner"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto px-3 pb-24 custom-scrollbar">
                                {isLoading ? (
                                    <div className="flex items-center justify-center py-10 opacity-20"><Icons.RotateCw className="w-6 h-6 animate-spin" /></div>
                                ) : (
                                    groupedMachines.map(group => (
                                        <div key={group.name} className="mb-2">
                                            <button 
                                                onClick={() => toggleBrand(group.name)}
                                                className="w-full flex items-center justify-between px-3 py-2 text-[10px] font-black tracking-[0.15em] text-slate-500 uppercase hover:text-slate-300 transition-colors group"
                                            >
                                                <div className="flex items-center gap-2">
                                                    <Icons.Folder className={`w-3.5 h-3.5 ${expandedBrands[group.name] ? 'text-red-500' : 'text-slate-700'}`} />
                                                    <span>{group.name}</span>
                                                </div>
                                                {expandedBrands[group.name] ? <Icons.ChevronDown /> : <Icons.ChevronRight />}
                                            </button>
                                            
                                            {(expandedBrands[group.name] || searchQuery) && (
                                                <div className="mt-1 space-y-0.5">
                                                    {group.items.map(machine => (
                                                        <button 
                                                            key={machine.id} 
                                                            onClick={() => handleSelectMachine(machine)} 
                                                            className={`w-full text-left p-3 rounded-xl flex items-center justify-between transition-all group ${selectedMachine?.id === machine.id ? 'sidebar-item-active' : 'hover:bg-white/5'}`}
                                                        >
                                                            <div className="flex items-center gap-3 min-w-0">
                                                                <div className={`w-6 h-6 rounded-lg flex items-center justify-center text-[10px] font-black shrink-0 ${selectedMachine?.id === machine.id ? 'bg-white/20 text-white' : machine.brand.color}`}>
                                                                    {machine.brand.icon}
                                                                </div>
                                                                <span className={`font-bold text-[11px] truncate uppercase tracking-tight ${selectedMachine?.id === machine.id ? 'text-white' : 'text-slate-400 group-hover:text-slate-200'}`}>
                                                                    {machine.name}
                                                                </span>
                                                            </div>
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))
                                )}
                            </div>

                            <div className="mt-auto p-4 bg-[#050505] border-t border-white/5 flex items-center justify-between text-[8px] font-black tracking-widest text-slate-600 uppercase shrink-0">
                                <div className="flex items-center gap-2">
                                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.3)]"></div>
                                    <span>Sync Stable</span>
                                </div>
                                <div className="flex items-center gap-1.5"><Icons.Cpu /><span>v2.0-PRO</span></div>
                            </div>
                        </aside>

                        <main className="flex-1 bg-black flex flex-col relative overflow-hidden transition-all duration-300">
                            {viewMode === 'directory' ? (
                                <div className="flex-1 overflow-y-auto p-4 sm:p-10 bg-black custom-scrollbar">
                                    <div className="max-w-2xl mx-auto">
                                        <div className="flex items-center gap-5 mb-8 border-b border-white/5 pb-6">
                                            <div className="bg-red-600 p-4 rounded-2xl shadow-lg shadow-red-900/20">
                                                <Icons.Phone className="w-7 h-7 text-white" />
                                            </div>
                                            <div>
                                                <h2 className="text-2xl font-black uppercase tracking-widest text-white leading-none">Engineering Support</h2>
                                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-2 italic">Direct manufacturer service lines</p>
                                            </div>
                                        </div>

                                        <div className="mb-8 p-5 rounded-2xl bg-red-900/5 border border-dashed border-red-500/20 text-center flex items-center justify-center gap-4">
                                            <Icons.AlertCircle className="w-5 h-5 text-red-500 shrink-0" />
                                            <p className="text-[11px] text-slate-400 font-black uppercase tracking-[0.15em]">Have model & serial numbers ready</p>
                                        </div>
                                        
                                        <div className="grid gap-3 pb-24">
                                            {techSupport.map((contact, idx) => {
                                                const brandStyle = getBrandInfo(contact.brand);
                                                return (
                                                    <div key={idx} className="glass-panel border border-white/5 p-5 rounded-2xl flex items-center justify-between hover:border-white/20 transition-all group">
                                                        <div className="min-w-0">
                                                            <div className="flex items-center gap-2 mb-1.5">
                                                                <span className={`brand-badge border ${brandStyle.color}`}>
                                                                    {contact.brand}
                                                                </span>
                                                                <h4 className="text-xs font-black text-slate-300 group-hover:text-white transition-colors truncate">{contact.name}</h4>
                                                            </div>
                                                            <p className="text-[9px] text-slate-500 font-mono uppercase tracking-tighter">Emergency Tech Line</p>
                                                        </div>
                                                        <a href={`tel:${contact.phone.replace(/[^0-9]/g, '')}`} className="bg-white/5 hover:bg-emerald-600 text-white px-5 py-3 rounded-xl font-black text-[11px] tracking-widest uppercase transition-all active:scale-95 border border-white/5 flex items-center gap-2">
                                                            <Icons.Phone className="w-3.5 h-3.5" />
                                                            <span className="hidden sm:inline">{contact.phone}</span>
                                                            <span className="sm:hidden">CALL</span>
                                                        </a>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            ) : selectedMachine ? (
                                <>
                                    <div className="flex-1 w-full bg-black relative">
                                        {selectedMachine.isMaster && (
                                            <div className="absolute inset-0 z-10 bg-black/40 pointer-events-none border-b border-red-500/20"></div>
                                        )}
                                        <div className="pdf-container">
                                            <iframe key={`${selectedMachine.id}-${refreshKey}`} src={pdfViewerUrl} title="Repair Manual" className="viewer-frame" />
                                        </div>
                                        <div className="absolute top-4 right-4 flex flex-col gap-2 z-20">
                                            <a href={selectedMachine.url} target="_blank" rel="noopener noreferrer" className="bg-red-600 p-3 rounded-xl hover:bg-red-700 transition-colors shadow-2xl border border-red-500 flex items-center justify-center text-white active:scale-95 group">
                                                <Icons.ExternalLink />
                                                <span className="max-w-0 overflow-hidden group-hover:max-w-xs group-hover:ml-2 transition-all text-[10px] font-black uppercase whitespace-nowrap">External View</span>
                                            </a>
                                        </div>
                                        {selectedMachine.isMaster && (
                                            <div className="absolute top-4 left-4 flex items-center gap-3 bg-red-600 px-4 py-2 rounded-xl shadow-2xl border border-red-500 z-20">
                                                <Icons.Package className="w-4 h-4" />
                                                <span className="text-[10px] font-black uppercase tracking-widest">Master Inventory Active</span>
                                            </div>
                                        )}
                                    </div>
                                    <div className="bg-[#050505] border-t border-white/5 p-3 flex gap-2 shadow-2xl shrink-0 pb-20 sm:pb-3">
                                        <button onClick={() => setRefreshKey(k => k+1)} className="flex-1 bg-white/5 hover:bg-white/10 border border-white/5 text-white py-4 px-2 rounded-xl flex items-center justify-center gap-2 font-black text-[10px] uppercase tracking-widest transition-all active:scale-95">
                                            <Icons.RotateCw className="w-3.5 h-3.5" /> Reload Scheme
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center p-12 text-center bg-[radial-gradient(circle_at_center,_#111_0%,_#000_100%)]">
                                    <div className="w-24 h-24 bg-white/5 rounded-3xl flex items-center justify-center mb-8 border border-white/5 shadow-2xl p-4 logo-shine">
                                        <img src={LOGO_URL} alt="Ellis Coffee Logo" className="w-full h-full object-contain opacity-60" />
                                    </div>
                                    <h2 className="text-xl font-black text-white mb-3 tracking-[0.4em] uppercase leading-none">Repair Hub OS</h2>
                                    <p className="max-w-[280px] text-[11px] text-slate-500 font-bold uppercase tracking-widest leading-relaxed mt-2 opacity-80">Manufacturer Schematics, Part IDs, and Technical Engineering Support.</p>
                                    {!isMenuOpen && (
                                        <button onClick={() => setIsMenuOpen(true)} className="mt-10 bg-red-600 hover:bg-red-500 text-white px-12 py-4 rounded-2xl font-black text-[11px] shadow-xl transition-all active:scale-95 uppercase tracking-widest">Go to Manuals</button>
                                    )}
                                    
                                    <div className="absolute bottom-24 left-0 right-0 text-center pointer-events-none opacity-10">
                                        <p className="text-[9px] text-white font-black uppercase tracking-[1em]">© 2026 @JohnPatton</p>
                                    </div>
                                </div>
                            )}
                        </main>

                        {/* Mobile Bottom Tab Bar */}
                        <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-[#050505] border-t border-white/10 glass-panel flex items-center justify-around px-6 z-[60]">
                            <button onClick={() => { setViewMode('manual'); setSelectedMachine(null); }} className={`flex flex-col items-center gap-1 relative ${viewMode === 'manual' && !selectedMachine ? 'bottom-nav-active' : 'text-slate-500'}`}>
                                <Icons.Home className="w-5 h-5" />
                                <span className="text-[8px] font-black uppercase tracking-tighter">Home</span>
                            </button>
                            <button onClick={() => setIsMenuOpen(true)} className={`flex flex-col items-center gap-1 relative ${isMenuOpen ? 'bottom-nav-active' : 'text-slate-500'}`}>
                                <Icons.BookOpen className="w-5 h-5" />
                                <span className="text-[8px] font-black uppercase tracking-tighter">Manuals</span>
                            </button>
                            <button onClick={() => { setViewMode('directory'); setSelectedMachine(null); }} className={`flex flex-col items-center gap-1 relative ${viewMode === 'directory' ? 'bottom-nav-active' : 'text-slate-500'}`}>
                                <Icons.Phone className="w-5 h-5" />
                                <span className="text-[8px] font-black uppercase tracking-tighter">Support</span>
                            </button>
                            <a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer" className="flex flex-col items-center gap-1 text-slate-500">
                                <Icons.Sparkles className="w-5 h-5" />
                                <span className="text-[8px] font-black uppercase tracking-tighter">AI Help</span>
                            </a>
                        </nav>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
