<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ellis Coffee Part Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        
        :root {
            --app-height: 100dvh;
        }

        body, html { 
            height: var(--app-height);
            margin: 0; 
            overflow: hidden; 
            background-color: #000000; 
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        #root { height: 100%; display: flex; flex-direction: column; }

        iframe { 
            background-color: #000000; 
            border: none; 
            width: 100%; 
            height: 100%; 
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        .pdf-container { position: relative; height: 100%; width: 100%; overflow: hidden; }

        .brand-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            padding: 1px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .logo-shine {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .logo-shine::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .sidebar-item-active {
            background: linear-gradient(90deg, #dc2626 0%, #7f1d1d 100%);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }

        .glass-panel {
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .bottom-nav-active {
            color: #ef4444;
        }
        
        /* The Red Line Indicator */
        .bottom-nav-active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
            border-radius: 0 0 10px 10px;
        }

        .ai-loading { animation: pulse-ai 1.5s infinite ease-in-out; }
        @keyframes pulse-ai {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        // --- GEMINI API CONFIG ---
        const apiKey = ""; // <--- PASTE YOUR AIza... KEY HERE
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
        
        // --- APP CONFIG ---
        const GITHUB_USERNAME = "24Dupo24"; 
        const REPO_NAME = "ellis-repair"; 
        const BASE_PDF_PATH = "work"; 
        const LOGO_URL = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/images/ellis-coffee-logo.png`; 

        const Icon = ({ path, className = "w-4 h-4", fill = "none", strokeWidth = "2.5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                {path}
            </svg>
        );

        const Icons = {
            Search: () => <Icon path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Menu: () => <Icon path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />,
            X: () => <Icon path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />,
            ChevronDown: (props) => <Icon {...props} className="w-3 h-3" path={<path d="m6 9 6 6 6-6"/>} />,
            ChevronRight: (props) => <Icon {...props} className="w-3 h-3" path={<path d="m9 18 6-6-6-6"/>} />,
            ChevronLeft: (props) => <Icon {...props} className="w-5 h-5" path={<path d="m15 18-6-6 6-6"/>} />,
            RotateCw: (props) => <Icon {...props} path={<><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>} />,
            ExternalLink: () => <Icon className="w-4 h-4" path={<><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>} />,
            Home: (props) => <Icon {...props} path={<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />} />,
            Phone: (props) => <Icon {...props} path={<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />} />,
            Sparkles: (props) => <Icon {...props} path={<path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z" />} />,
            Folder: (props) => <Icon {...props} path={<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z" />} />,
            Send: (props) => <Icon {...props} path={<path d="m22 2-7 20-4-9-9-4Z" />} />,
            Camera: (props) => <Icon {...props} path={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>} />
        };

        const getBrandInfo = (name) => {
            const n = name.toUpperCase();
            if (n.includes('BUNN')) return { label: 'BUNN', color: 'bg-red-500/10 text-red-400 border-red-500/20', icon: 'B' };
            if (n.includes('CURTIS')) return { label: 'CURTIS', color: 'bg-amber-500/10 text-amber-400 border-amber-500/20', icon: 'C' };
            if (n.includes('FETCO')) return { label: 'FETCO', color: 'bg-blue-500/10 text-blue-400 border-blue-500/20', icon: 'F' };
            if (n.includes('GRIND')) return { label: 'GRINDMASTER', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', icon: 'G' };
            if (n.includes('NEWCO')) return { label: 'NEWCO', color: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20', icon: 'N' };
            return { label: 'OEM', color: 'bg-slate-500/10 text-slate-400 border-slate-500/20', icon: 'P' };
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMachine, setSelectedMachine] = useState(null);
            const [viewMode, setViewMode] = useState('manual'); 
            const [isMenuOpen, setIsMenuOpen] = useState(window.innerWidth >= 768);
            const [refreshKey, setRefreshKey] = useState(0); 
            const [expandedBrands, setExpandedBrands] = useState({});

            // ✨ AI State
            const [aiQuery, setAiQuery] = useState('');
            const [aiChat, setAiChat] = useState([]);
            const [isAiThinking, setIsAiThinking] = useState(false);
            const [attachedImage, setAttachedImage] = useState(null);
            const chatEndRef = useRef(null);

            // --- 🛠️ YOUR MANUAL FILE LIST (ADD FILES HERE) ---
            // Just add the exact filename as it appears in your GitHub folder
            const manualFiles = [
                { name: "MASTER STOCK INVENTORY", file: "ellis_parts_list_complete.pdf", isMaster: true },
                { name: "Bunn ICB-DV Setup", file: "Bunn_ICB.pdf" },
                { name: "Curtis G4 Parts", file: "Curtis_G4.pdf" },
                { name: "Fetco 2131 Wiring", file: "Fetco_2131.pdf" },
                { name: "Grindmaster Parts", file: "Grindmaster_Parts.pdf" },
                { name: "Newco Bistro", file: "Newco_Bistro.pdf" }
            ];

            const machines = useMemo(() => {
                return manualFiles.map((m, index) => {
                    const rawUrl = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/${BASE_PDF_PATH}/${m.file}`;
                    return {
                        id: `m-${index}`,
                        ...m,
                        url: rawUrl,
                        brand: m.isMaster ? { label: 'STOCK', color: 'bg-red-600 text-white border-red-500 font-black shadow-inner', icon: '★' } : getBrandInfo(m.name),
                    };
                });
            }, []);

            const techSupport = [
                { name: "Grindmaster Support", phone: "1-800-695-4500", brand: "GRINDMASTER" },
                { name: "Bunn Technical Support", phone: "1-800-637-8606", brand: "BUNN" },
                { name: "Curtis Technical Service", phone: "1-800-421-6150", brand: "CURTIS" },
                { name: "Fetco Tech Support", phone: "1-800-338-2699", brand: "FETCO" },
                { name: "Newco Support Team", phone: "1-800-325-7867", brand: "NEWCO" }
            ];

            useEffect(() => {
                const groups = {};
                machines.forEach(m => { groups[m.isMaster ? "MASTER LISTS" : m.brand.label] = true; });
                setExpandedBrands(groups);
            }, [machines]);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [aiChat]);

            const groupedMachines = useMemo(() => {
                const groups = {};
                const filtered = machines.filter(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()));
                filtered.forEach(m => {
                    const groupName = m.isMaster ? "MASTER LISTS" : m.brand.label;
                    if (!groups[groupName]) groups[groupName] = [];
                    groups[groupName].push(m);
                });
                return Object.keys(groups).sort((a, b) => a === "MASTER LISTS" ? -1 : a.localeCompare(b))
                    .map(name => ({ name, items: groups[name] }));
            }, [searchQuery, machines]);

            const handleSelectMachine = (machine) => {
                setSelectedMachine(machine);
                setViewMode('manual');
                if (window.innerWidth < 768) setIsMenuOpen(false);
            };

            const callGemini = async (prompt, imageData = null) => {
                if (!apiKey) {
                    setAiChat(prev => [...prev, { role: 'ai', text: "🚨 API KEY ERROR: Please ensure you pasted your AIza... key into index.html." }]);
                    return;
                }
                setIsAiThinking(true);
                const context = selectedMachine ? `Working on ${selectedMachine.name}. ` : "";
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: context + prompt }, ...(imageData ? [{ inlineData: { mimeType: "image/png", data: imageData.split(',')[1] } }] : [])] }],
                            systemInstruction: { parts: [{ text: "Expert coffee machine repair tech for Ellis Coffee." }] }
                        })
                    });
                    const result = await response.json();
                    setAiChat(prev => [...prev, { role: 'ai', text: result.candidates[0].content.parts[0].text }]);
                } catch (e) {
                    setAiChat(prev => [...prev, { role: 'ai', text: "Check your signal or API key." }]);
                } finally { setIsAiThinking(false); }
            };

            return (
                <div className="flex flex-col h-full bg-black text-white overflow-hidden">
                    <header className="bg-[#050505] border-b border-white/5 p-3 flex justify-between items-center z-50 shrink-0">
                        <div className="logo-shine h-8 sm:h-10 cursor-pointer" onClick={() => {setSelectedMachine(null); setViewMode('manual');}}>
                            <img src={LOGO_URL} alt="Logo" className="h-full w-auto object-contain" />
                        </div>
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 text-slate-400">
                            {isMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}
                        </button>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        <aside className={`fixed inset-0 z-40 bg-black transition-all duration-300 transform ${isMenuOpen ? 'translate-x-0' : '-translate-x-full md:relative md:translate-x-0 md:w-80'} border-white/5 flex flex-col overflow-hidden`}>
                            <div className="p-4 bg-[#050505] shrink-0">
                                <div className="relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-700"><Icons.Search /></div>
                                    <input type="text" placeholder="Search..." className="w-full bg-white/5 border border-white/5 rounded-xl py-3 pl-10 text-xs" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto px-3 pb-24 custom-scrollbar">
                                {groupedMachines.map(group => (
                                    <div key={group.name} className="mb-2">
                                        <button onClick={() => toggleBrand(group.name)} className="w-full flex items-center justify-between px-3 py-2 text-[10px] font-black tracking-widest text-slate-500 uppercase">
                                            <div className="flex items-center gap-2"><Icons.Folder className={`w-3.5 h-3.5 ${expandedBrands[group.name] ? 'text-red-500' : 'text-slate-700'}`} /><span>{group.name}</span></div>
                                            {expandedBrands[group.name] ? <Icons.ChevronDown /> : <Icons.ChevronRight />}
                                        </button>
                                        {expandedBrands[group.name] && (
                                            <div className="mt-1 space-y-0.5">
                                                {group.items.map(m => (
                                                    <button key={m.id} onClick={() => handleSelectMachine(m)} className={`w-full text-left p-3 rounded-xl flex items-center justify-between group ${selectedMachine?.id === m.id ? 'sidebar-item-active' : 'hover:bg-white/5'}`}>
                                                        <div className="flex items-center gap-3 min-w-0">
                                                            <div className={`w-6 h-6 rounded-lg flex items-center justify-center text-[10px] font-black shrink-0 ${selectedMachine?.id === m.id ? 'bg-white/20' : m.brand.color}`}>{m.brand.icon}</div>
                                                            <span className={`font-bold text-[11px] truncate uppercase ${selectedMachine?.id === m.id ? 'text-white' : 'text-slate-400'}`}>{m.name}</span>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </aside>

                        <main className="flex-1 bg-black flex flex-col relative overflow-hidden">
                            {viewMode === 'ai' ? (
                                <div className="flex flex-col h-full bg-black pb-32 sm:pb-0">
                                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                                        {aiChat.map((msg, i) => (
                                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[90%] p-4 rounded-2xl text-xs ${msg.role === 'user' ? 'bg-red-600' : 'bg-white/5 border border-white/5 text-slate-300'}`}>
                                                    {msg.image && <img src={msg.image} className="rounded-lg mb-2 max-h-60" />}
                                                    <p className="whitespace-pre-wrap">{msg.text}</p>
                                                </div>
                                            </div>
                                        ))}
                                        {isAiThinking && <div className="ai-loading text-[10px] font-black text-purple-400 uppercase">Thinking...</div>}
                                        <div ref={chatEndRef} />
                                    </div>
                                    <div className="p-4 glass-panel safe-area-bottom">
                                        <form onSubmit={(e) => {e.preventDefault(); handleAiSend();}} className="flex gap-2">
                                            <label className="p-3 bg-white/5 rounded-xl cursor-pointer shrink-0 border border-white/5">
                                                <Icons.Camera className="w-5 h-5 text-slate-400" />
                                                <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => {
                                                    const reader = new FileReader();
                                                    reader.onloadend = () => setAttachedImage(reader.result);
                                                    reader.readAsDataURL(e.target.files[0]);
                                                }} />
                                            </label>
                                            <input value={aiQuery} onChange={e => setAiQuery(e.target.value)} placeholder="Ask about an error code..." className="flex-1 bg-white/5 rounded-xl px-4 text-sm outline-none border border-white/5" />
                                            <button type="submit" className="p-3 bg-purple-600 rounded-xl shrink-0"><Icons.Send className="w-5 h-5" /></button>
                                        </form>
                                    </div>
                                </div>
                            ) : selectedMachine ? (
                                <div className="flex flex-col h-full bg-black">
                                    <div className="flex-1 relative">
                                        <iframe key={`${selectedMachine.id}-${refreshKey}`} src={pdfViewerUrl} className="viewer-frame" />
                                        <button onClick={handleHome} className="md:hidden absolute top-4 left-4 z-50 bg-red-600 w-10 h-10 rounded-full flex items-center justify-center floating-back"><Icons.ChevronLeft /></button>
                                        <div className="absolute top-4 right-4 flex flex-col gap-2">
                                            <a href={selectedMachine.url} target="_blank" className="bg-red-600 p-3 rounded-xl"><Icons.ExternalLink /></a>
                                            <button onClick={() => setViewMode('ai')} className="bg-purple-600 p-3 rounded-xl"><Icons.Sparkles className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                    <div className="p-3 bg-[#050505] border-t border-white/5 pb-20 sm:pb-3">
                                        <button onClick={() => setRefreshKey(k => k+1)} className="w-full bg-white/5 py-4 rounded-xl font-black text-[10px] uppercase">Reload Manual</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center p-12 text-center opacity-40">
                                    <Icons.BookOpen className="w-12 h-12 mb-4" />
                                    <h2 className="text-xl font-black uppercase tracking-widest">Select Manual</h2>
                                </div>
                            )}
                        </main>

                        <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 glass-panel flex items-center justify-around px-2 z-[60] safe-area-bottom">
                            <button onClick={() => { setViewMode('manual'); setSelectedMachine(null); setIsMenuOpen(false); }} className={`flex flex-col items-center gap-1 flex-1 relative ${viewMode === 'manual' && !selectedMachine && !isMenuOpen ? 'bottom-nav-active' : 'text-slate-500'}`}><Icons.Home className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">Home</span></button>
                            <button onClick={() => { setViewMode('manual'); setIsMenuOpen(true); }} className={`flex flex-col items-center gap-1 flex-1 relative ${isMenuOpen ? 'bottom-nav-active' : 'text-slate-500'}`}><Icons.BookOpen className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">Manuals</span></button>
                            <button onClick={() => window.location.reload()} className="flex flex-col items-center gap-1 text-slate-500 flex-1"><Icons.RotateCw className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">Sync</span></button>
                            <button onClick={() => { setViewMode('ai'); setSelectedMachine(null); setIsMenuOpen(false); }} className={`flex flex-col items-center gap-1 flex-1 relative ${viewMode === 'ai' ? 'bottom-nav-active' : 'text-slate-500 text-purple-400/50'}`}><Icons.Sparkles className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">AI Help</span></button>
                        </nav>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
