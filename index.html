<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ellis Coffee Part Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body, html { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            background-color: #000000; 
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        iframe { 
            background-color: #000000; 
            border: none; 
            width: 100%; 
            height: 100%; 
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        .pdf-container { position: relative; height: 100%; width: 100%; overflow: hidden; }

        .brand-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            padding: 1px 5px;
            border-radius: 3px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .logo-shine {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .logo-shine::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .sidebar-item-active {
            background: linear-gradient(90deg, #dc2626 0%, #7f1d1d 100%);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
        }

        .ai-glow {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.1);
        }

        .glass-panel {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .viewer-frame {
            border: 0;
            width: 100%;
            height: 100%;
        }

        .bottom-nav-active {
            color: #ef4444;
        }
        
        /* Fixed red line styling */
        .bottom-nav-active::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: #ef4444;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }
        
        .floating-back {
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes pulse-ai {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        .ai-loading { animation: pulse-ai 1.5s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        // --- GEMINI API CONFIG ---
        // NOTE: If using on GitHub, you must paste your API key here
        const apiKey = ""; 
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
        
        // --- APP CONFIG ---
        const GITHUB_USERNAME = "24Dupo24"; 
        const REPO_NAME = "ellis-repair"; 
        const BASE_PDF_PATH = "work"; 
        const LOGO_URL = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/images/ellis-coffee-logo.png`; 

        const Icon = ({ path, className = "w-4 h-4", fill = "none", strokeWidth = "2.5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
                {path}
            </svg>
        );

        const Icons = {
            Search: () => <Icon path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Menu: () => <Icon path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />,
            X: () => <Icon path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />,
            ChevronDown: (props) => <Icon {...props} className="w-3 h-3" path={<path d="m6 9 6 6 6-6"/>} />,
            ChevronRight: (props) => <Icon {...props} className="w-3 h-3" path={<path d="m9 18 6-6-6-6"/>} />,
            ChevronLeft: (props) => <Icon {...props} className="w-5 h-5" path={<path d="m15 18-6-6 6-6"/>} />,
            RotateCw: (props) => <Icon {...props} path={<><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>} />,
            ExternalLink: () => <Icon className="w-4 h-4" path={<><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>} />,
            Home: (props) => <Icon {...props} path={<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />} />,
            Globe: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>} />,
            Phone: (props) => <Icon {...props} path={<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />} />,
            AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Sparkles: (props) => <Icon {...props} path={<path d="m12 3 1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3Z" />} />,
            Mail: (props) => <Icon {...props} path={<><path d="m3 7 9 6 9-6M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></>} />,
            Folder: (props) => <Icon {...props} path={<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z" />} />,
            Send: (props) => <Icon {...props} path={<path d="m22 2-7 20-4-9-9-4Z" />} />,
            Camera: (props) => <Icon {...props} path={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>} />
        };

        const getBrandInfo = (name) => {
            const n = name.toUpperCase();
            if (n.includes('BUNN')) return { label: 'BUNN', color: 'bg-red-500/10 text-red-400 border-red-500/20', icon: 'B' };
            if (n.includes('CURTIS')) return { label: 'CURTIS', color: 'bg-amber-500/10 text-amber-400 border-amber-500/20', icon: 'C' };
            if (n.includes('FETCO')) return { label: 'FETCO', color: 'bg-blue-500/10 text-blue-400 border-blue-500/20', icon: 'F' };
            if (n.includes('GRIND')) return { label: 'GRINDMASTER', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', icon: 'G' };
            if (n.includes('SIMONELLI')) return { label: 'SIMONELLI', color: 'bg-sky-500/10 text-sky-400 border-sky-500/20', icon: 'S' };
            if (n.includes('NEWCO') || n.includes('BISTRO')) return { label: 'NEWCO', color: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20', icon: 'N' };
            if (n.includes('FLAVIA') || n.includes('LAVAZZA')) return { label: 'FLAVIA', color: 'bg-fuchsia-500/10 text-fuchsia-400 border-fuchsia-500/20', icon: 'L' };
            if (n.includes('EVOCA')) return { label: 'EVOCA', color: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20', icon: 'E' };
            if (n.includes('CECILWARE')) return { label: 'CECILWARE', color: 'bg-orange-500/10 text-orange-400 border-orange-500/20', icon: 'CW' };
            if (n.includes('CORNELIUS')) return { label: 'CORNELIUS', color: 'bg-lime-500/10 text-lime-400 border-lime-500/20', icon: 'CR' };
            if (n.includes('HAMILTON')) return { label: 'HAMILTON', color: 'bg-slate-400/10 text-slate-300 border-slate-400/20', icon: 'HB' };
            if (n.includes('NESPRESSO')) return { label: 'NESPRESSO', color: 'bg-stone-500/10 text-stone-400 border-stone-500/20', icon: 'NP' };
            if (n.includes('ROYAL')) return { label: 'ROYAL CUP', color: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20', icon: 'RC' };
            return { label: 'OEM PART', color: 'bg-slate-500/10 text-slate-400 border-slate-500/20', icon: 'P' };
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMachine, setSelectedMachine] = useState(null);
            const [viewMode, setViewMode] = useState('manual'); 
            const [isMenuOpen, setIsMenuOpen] = useState(window.innerWidth >= 768);
            const [refreshKey, setRefreshKey] = useState(0); 
            const [machines, setMachines] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [expandedBrands, setExpandedBrands] = useState({});

            // ✨ Gemini AI State
            const [aiQuery, setAiQuery] = useState('');
            const [aiChat, setAiChat] = useState([]);
            const [isAiThinking, setIsAiThinking] = useState(false);
            const [attachedImage, setAttachedImage] = useState(null);
            const chatEndRef = useRef(null);

            const techSupport = [
                { name: "Grindmaster Support", phone: "1-800-695-4500", brand: "GRINDMASTER" },
                { name: "Bunn Technical Support", phone: "1-800-637-8606", brand: "BUNN" },
                { name: "Curtis Technical Service", phone: "1-800-421-6150", brand: "CURTIS" },
                { name: "Lavazza / Flavia Support", phone: "1-877-273-5812", brand: "FLAVIA" },
                { name: "Fetco Tech Support", phone: "1-800-338-2699", brand: "FETCO" },
                { name: "Gulf Ice / Cornelius", phone: "1-800-322-4853", brand: "CORNELIUS" },
                { name: "Hamilton Beach Support", phone: "1-800-572-3331", brand: "HAMILTON" },
                { name: "Nespresso Support Line", phone: "1-800-566-0571", brand: "NESPRESSO" },
                { name: "Newco Support Team", phone: "1-800-325-7867", brand: "NEWCO" },
                { name: "Royal Cup Support", phone: "1-800-366-5836", brand: "ROYAL" },
                { name: "Nuova Simonelli Support", phone: "360-366-2226", brand: "SIMONELLI" },
            ];

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [aiChat]);

            useEffect(() => {
                const handlePopState = () => {
                    if (selectedMachine || viewMode === 'directory' || isMenuOpen || viewMode === 'ai') {
                        setSelectedMachine(null);
                        setViewMode('manual');
                        setIsMenuOpen(window.innerWidth >= 768);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [selectedMachine, viewMode, isMenuOpen]);

            const fetchFiles = async () => {
                setIsLoading(true);
                try {
                    const apiURL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${BASE_PDF_PATH}?t=${Date.now()}`;
                    const response = await fetch(apiURL);
                    if (response.ok) {
                        const data = await response.json();
                        const pdfList = data.filter(file => file.name.toLowerCase().endsWith('.pdf')).map((file, index) => {
                            const rawUrl = `https://${GITHUB_USERNAME}.github.io/${REPO_NAME}/${BASE_PDF_PATH}/${encodeURIComponent(file.name)}`;
                            const isMasterFile = file.name.toLowerCase().replace(/_/g, ' ').includes('ellis parts list complete');
                            return {
                                id: `gh-${index}`,
                                name: isMasterFile ? "MASTER STOCK INVENTORY" : file.name.replace(/_/g, ' ').replace('.pdf', ''),
                                file: file.name,
                                url: rawUrl,
                                brand: isMasterFile ? { label: 'STOCK', color: 'bg-red-600 text-white border-red-500 font-black shadow-inner', icon: '★' } : getBrandInfo(file.name),
                                isMaster: isMasterFile
                            };
                        });
                        setMachines(pdfList);
                    }
                } catch (err) { console.error(err); } finally { setIsLoading(false); }
            };

            useEffect(() => { fetchFiles(); }, []);

            const groupedMachines = useMemo(() => {
                const groups = {};
                const filtered = machines.filter(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()));
                filtered.forEach(m => {
                    const groupName = m.isMaster ? "MASTER LISTS" : m.brand.label;
                    if (!groups[groupName]) groups[groupName] = [];
                    groups[groupName].push(m);
                });
                return Object.keys(groups).sort((a, b) => a === "MASTER LISTS" ? -1 : a.localeCompare(b))
                    .map(name => ({ name, items: groups[name].sort((a, b) => a.name.localeCompare(b.name)) }));
            }, [searchQuery, machines]);

            const handleSelectMachine = (machine) => {
                setSelectedMachine(machine);
                setViewMode('manual');
                window.history.pushState({ view: 'manual' }, '');
                if (window.innerWidth < 768) setIsMenuOpen(false);
            };

            const handleHome = () => {
                setSelectedMachine(null);
                setViewMode('manual');
                setIsMenuOpen(window.innerWidth >= 768);
            };

            const toggleBrand = (brandName) => {
                setExpandedBrands(prev => ({ ...prev, [brandName]: !prev[brandName] }));
            };

            // ✨ Gemini AI Integration Logic
            const callGemini = async (prompt, imageData = null) => {
                if (!apiKey) {
                    setAiChat(prev => [...prev, { 
                        role: 'ai', 
                        text: "🚨 API KEY MISSING: You are running this on GitHub. To use AI, you must paste your personal Gemini API key into the top of the 'index.html' file." 
                    }]);
                    setIsAiThinking(false);
                    return;
                }

                setIsAiThinking(true);
                const systemPrompt = "You are a professional coffee machine repair expert for Ellis Coffee. You provide technical, accurate, and concise troubleshooting for Bunn, Curtis, Fetco, Newco, and Espresso machines. Always prioritize safety (electricity/boiling water). If an image is provided, identify parts or read error codes.";
                const machineContext = selectedMachine ? `I am currently working on a ${selectedMachine.name}. ` : "";
                const finalPrompt = machineContext + prompt;

                const payload = {
                    contents: [{
                        parts: [
                            { text: finalPrompt },
                            ...(imageData ? [{ inlineData: { mimeType: "image/png", data: imageData.split(',')[1] } }] : [])
                        ]
                    }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                let delay = 1000;
                for (let i = 0; i < 5; i++) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            setAiChat(prev => [...prev, { role: 'ai', text }]);
                            setIsAiThinking(false);
                            return;
                        }
                    } catch (e) {
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                    }
                }
                setAiChat(prev => [...prev, { role: 'ai', text: "Connection issues. Please check your signal and ensure your API key is valid." }]);
                setIsAiThinking(false);
            };

            const handleAiSend = (e) => {
                e?.preventDefault();
                if (!aiQuery.trim() && !attachedImage) return;
                const userMsg = { role: 'user', text: aiQuery, image: attachedImage };
                setAiChat(prev => [...prev, userMsg]);
                callGemini(aiQuery, attachedImage);
                setAiQuery('');
                setAttachedImage(null);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => setAttachedImage(reader.result);
                reader.readAsDataURL(file);
            };

            const pdfViewerUrl = selectedMachine 
                ? `https://docs.google.com/viewer?url=${encodeURIComponent(selectedMachine.url)}&embedded=true&refresh=${refreshKey}`
                : null;

            return (
                <div className="flex flex-col h-screen bg-black text-white font-sans overflow-hidden">
                    <header className="bg-[#050505] border-b border-white/5 p-3 flex justify-between items-center z-50 shadow-2xl shrink-0">
                        <div className="flex items-center gap-1.5 sm:gap-2">
                            <div className="logo-shine h-8 sm:h-10 w-auto flex items-center cursor-pointer mr-1 sm:mr-4" onClick={handleHome}>
                                <img src={LOGO_URL} alt="Ellis Coffee" className="h-full w-auto object-contain max-w-[90px] sm:max-w-[120px]" />
                            </div>
                            <div className="hidden sm:flex items-center gap-2">
                                <button onClick={handleHome} className="p-2 hover:bg-white/5 rounded-lg transition-colors text-slate-500 hover:text-red-500" title="Home"><Icons.Home className="w-5 h-5" /></button>
                                <button onClick={() => window.location.reload()} className="p-2 hover:bg-white/5 rounded-lg transition-colors text-slate-500 hover:text-red-500" title="Sync"><Icons.RotateCw className="w-5 h-5" /></button>
                                <a href="mailto:jpatton@elliscoffee.com?subject=New PDF Manual" className="p-2 hover:bg-white/5 rounded-lg transition-colors text-slate-500 hover:text-red-500"><Icons.Mail className="w-5 h-5" /></a>
                                <div className="h-6 w-[1px] bg-white/10 mx-2"></div>
                                <button onClick={() => setViewMode('directory')} className={`p-2 rounded-lg transition-colors ${viewMode === 'directory' ? 'bg-red-600 text-white' : 'text-slate-500 hover:text-red-500'}`}><Icons.Phone className="w-5 h-5" /></button>
                                <button onClick={() => setViewMode('ai')} className={`p-2 rounded-lg transition-colors ${viewMode === 'ai' ? 'bg-purple-600 text-white' : 'text-slate-500 hover:text-purple-400 ai-glow'}`}><Icons.Sparkles className="w-5 h-5" /></button>
                            </div>
                        </div>
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 hover:bg-white/5 rounded-lg text-slate-400 hover:text-white">
                            {isMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}
                        </button>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        <aside className={`fixed inset-0 z-40 bg-black transition-all duration-300 transform ${isMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'} md:relative md:flex md:flex-col ${isMenuOpen ? 'md:w-80 md:border-r' : 'md:w-0 md:opacity-0'} border-white/5 flex flex-col overflow-hidden`}>
                            <div className="p-4 space-y-3 bg-[#050505] shrink-0">
                                <div className="relative group">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-700 group-focus-within:text-red-500 transition-colors"><Icons.Search /></div>
                                    <input type="text" placeholder="Quick search..." className="w-full bg-white/5 border border-white/5 rounded-xl py-3 pl-10 pr-4 text-xs placeholder:text-slate-600" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto px-3 pb-24 custom-scrollbar">
                                {groupedMachines.map(group => (
                                    <div key={group.name} className="mb-2">
                                        <button onClick={() => toggleBrand(group.name)} className="w-full flex items-center justify-between px-3 py-2 text-[10px] font-black tracking-[0.15em] text-slate-500 uppercase hover:text-slate-300">
                                            <div className="flex items-center gap-2"><Icons.Folder className={`w-3.5 h-3.5 ${expandedBrands[group.name] ? 'text-red-500' : 'text-slate-700'}`} /><span>{group.name}</span></div>
                                            {expandedBrands[group.name] ? <Icons.ChevronDown /> : <Icons.ChevronRight />}
                                        </button>
                                        {(expandedBrands[group.name] || searchQuery) && (
                                            <div className="mt-1 space-y-0.5">
                                                {group.items.map(machine => (
                                                    <button key={machine.id} onClick={() => handleSelectMachine(machine)} className={`w-full text-left p-3 rounded-xl flex items-center justify-between transition-all group ${selectedMachine?.id === machine.id ? 'sidebar-item-active' : 'hover:bg-white/5'}`}>
                                                        <div className="flex items-center gap-3 min-w-0">
                                                            <div className={`w-6 h-6 rounded-lg flex items-center justify-center text-[10px] font-black shrink-0 ${selectedMachine?.id === machine.id ? 'bg-white/20 text-white' : machine.brand.color}`}>{machine.brand.icon}</div>
                                                            <span className={`font-bold text-[11px] truncate uppercase ${selectedMachine?.id === machine.id ? 'text-white' : 'text-slate-400'}`}>{machine.name}</span>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </aside>

                        <main className="flex-1 bg-black flex flex-col relative overflow-hidden">
                            {viewMode === 'ai' ? (
                                <div className="flex flex-col h-full bg-black">
                                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                                        <div className="max-w-2xl mx-auto space-y-4">
                                            {aiChat.length === 0 && (
                                                <div className="py-10 text-center space-y-4 opacity-50">
                                                    <div className="w-16 h-16 bg-purple-600/20 rounded-full flex items-center justify-center mx-auto"><Icons.Sparkles className="text-purple-400 w-8 h-8" /></div>
                                                    <p className="text-sm font-bold uppercase tracking-widest">✨ Ellis Diagnostic Assistant</p>
                                                    <p className="text-[10px] max-w-xs mx-auto">Snap a photo or describe the issue. I'll search for common fixes and error code meanings.</p>
                                                </div>
                                            )}
                                            {aiChat.map((msg, i) => (
                                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`max-w-[85%] p-4 rounded-2xl text-xs leading-relaxed ${msg.role === 'user' ? 'bg-red-600 text-white' : 'bg-white/5 border border-white/5 text-slate-300'}`}>
                                                        {msg.image && <img src={msg.image} className="rounded-lg mb-2 max-h-48" />}
                                                        <p className="whitespace-pre-wrap">{msg.text}</p>
                                                    </div>
                                                </div>
                                            ))}
                                            {isAiThinking && (
                                                <div className="flex justify-start">
                                                    <div className="bg-white/5 p-4 rounded-2xl flex items-center gap-3 ai-loading">
                                                        <Icons.Sparkles className="w-4 h-4 text-purple-400" />
                                                        <span className="text-[10px] font-black uppercase tracking-widest text-slate-500">Thinking...</span>
                                                    </div>
                                                </div>
                                            )}
                                            <div ref={chatEndRef} />
                                        </div>
                                    </div>
                                    <div className="p-4 bg-[#050505] border-t border-white/10 pb-20 sm:pb-4">
                                        <form onSubmit={handleAiSend} className="max-w-2xl mx-auto flex flex-col gap-3">
                                            {attachedImage && (
                                                <div className="relative w-16 h-16">
                                                    <img src={attachedImage} className="w-full h-full object-cover rounded-lg border border-purple-500" />
                                                    <button type="button" onClick={() => setAttachedImage(null)} className="absolute -top-2 -right-2 bg-black rounded-full p-0.5 border border-white/20"><Icons.X className="w-3 h-3" /></button>
                                                </div>
                                            )}
                                            <div className="flex items-center gap-2">
                                                <label className="p-3 bg-white/5 rounded-xl hover:bg-white/10 cursor-pointer transition-colors border border-white/5">
                                                    <Icons.Camera className="w-5 h-5 text-slate-400" />
                                                    <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleImageUpload} />
                                                </label>
                                                <input value={aiQuery} onChange={e => setAiQuery(e.target.value)} placeholder="Describe the symptom..." className="flex-1 bg-white/5 border border-white/5 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-purple-500" />
                                                <button type="submit" className="p-3 bg-purple-600 rounded-xl hover:bg-purple-500 transition-transform active:scale-90"><Icons.Send className="w-5 h-5 text-white" /></button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            ) : viewMode === 'directory' ? (
                                <div className="flex-1 overflow-y-auto p-4 sm:p-10 bg-black custom-scrollbar pb-32">
                                    <div className="max-w-2xl mx-auto">
                                        <div className="flex items-center gap-5 mb-8 border-b border-white/5 pb-6">
                                            <div className="bg-red-600 p-4 rounded-2xl shadow-lg shadow-red-900/20"><Icons.Phone className="w-7 h-7 text-white" /></div>
                                            <div><h2 className="text-2xl font-black uppercase tracking-widest text-white leading-none">Engineering Support</h2><p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-2 italic">Direct manufacturer service lines</p></div>
                                        </div>
                                        <div className="grid gap-3">
                                            {techSupport.map((contact, idx) => (
                                                <div key={idx} className="glass-panel border border-white/5 p-5 rounded-2xl flex items-center justify-between hover:border-white/20 transition-all">
                                                    <div className="min-w-0">
                                                        <div className="flex items-center gap-2 mb-1.5"><span className={`brand-badge border ${getBrandInfo(contact.brand).color}`}>{contact.brand}</span><h4 className="text-xs font-black text-slate-300">{contact.name}</h4></div>
                                                        <p className="text-[9px] text-slate-500 font-mono uppercase tracking-tighter">Emergency Tech Line</p>
                                                    </div>
                                                    <a href={`tel:${contact.phone.replace(/[^0-9]/g, '')}`} className="bg-white/5 hover:bg-emerald-600 text-white px-5 py-3 rounded-xl font-black text-[11px] tracking-widest uppercase border border-white/5 flex items-center gap-2"><Icons.Phone className="w-3.5 h-3.5" /><span className="hidden sm:inline">{contact.phone}</span><span className="sm:hidden">CALL</span></a>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ) : selectedMachine ? (
                                <>
                                    <div className="flex-1 w-full bg-black relative">
                                        <div className="pdf-container"><iframe key={`${selectedMachine.id}-${refreshKey}`} src={pdfViewerUrl} title="Repair Manual" className="viewer-frame" /></div>
                                        <button onClick={handleHome} className="md:hidden absolute top-4 left-4 z-50 bg-red-600 w-10 h-10 rounded-full flex items-center justify-center text-white floating-back active:scale-90"><Icons.ChevronLeft /></button>
                                        <div className="absolute top-4 right-4 flex flex-col gap-2 z-20">
                                            <a href={selectedMachine.url} target="_blank" rel="noopener noreferrer" className="bg-red-600 p-3 rounded-xl hover:bg-red-700 transition-colors shadow-2xl border border-red-500 flex items-center justify-center text-white active:scale-95 group">
                                                <Icons.ExternalLink />
                                                <span className="max-w-0 overflow-hidden group-hover:max-w-xs group-hover:ml-2 transition-all text-[10px] font-black uppercase whitespace-nowrap sm:inline hidden">Full View</span>
                                            </a>
                                            <button onClick={() => setViewMode('ai')} className="bg-purple-600 p-3 rounded-xl hover:bg-purple-700 shadow-2xl border border-purple-500 flex items-center justify-center text-white active:scale-95 group">
                                                <Icons.Sparkles className="w-4 h-4" />
                                                <span className="max-w-0 overflow-hidden group-hover:max-w-xs group-hover:ml-2 transition-all text-[10px] font-black uppercase whitespace-nowrap hidden sm:inline">✨ Diagnose</span>
                                            </button>
                                        </div>
                                    </div>
                                    <div className="bg-[#050505] border-t border-white/5 p-3 flex gap-2 shadow-2xl shrink-0 pb-20 sm:pb-3">
                                        <button onClick={() => setRefreshKey(k => k+1)} className="flex-1 bg-white/5 hover:bg-white/10 border border-white/5 text-white py-4 px-2 rounded-xl flex items-center justify-center gap-2 font-black text-[10px] uppercase tracking-widest active:scale-95"><Icons.RotateCw className="w-3.5 h-3.5" /> Reload Manual</button>
                                    </div>
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center p-12 text-center bg-[radial-gradient(circle_at_center,_#111_0%,_#000_100%)]">
                                    <div className="w-24 h-24 bg-white/5 rounded-3xl flex items-center justify-center mb-8 border border-white/5 shadow-2xl p-4 logo-shine"><img src={LOGO_URL} alt="Ellis Coffee Logo" className="w-full h-full object-contain opacity-60" /></div>
                                    <h2 className="text-xl font-black text-white mb-3 tracking-[0.4em] uppercase leading-none text-red-500">Repair Hub Pro</h2>
                                    <p className="max-w-[280px] text-[11px] text-slate-500 font-bold uppercase tracking-widest leading-relaxed mt-2 opacity-80">Schematics, Field Support, and AI-Powered Diagnostics.</p>
                                    {!isMenuOpen && <button onClick={() => setIsMenuOpen(true)} className="mt-10 bg-red-600 hover:bg-red-500 text-white px-12 py-4 rounded-2xl font-black text-[11px] shadow-xl transition-all active:scale-95 uppercase tracking-widest">Go to Manuals</button>}
                                </div>
                            )}
                        </main>

                        <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-[#050505] border-t border-white/10 glass-panel flex items-center justify-around px-2 z-[60]">
                            <button onClick={() => { setViewMode('manual'); setSelectedMachine(null); setIsMenuOpen(false); }} className={`flex flex-col items-center gap-1 flex-1 relative ${viewMode === 'manual' && !selectedMachine && !isMenuOpen ? 'bottom-nav-active' : 'text-slate-500'}`}><Icons.Home className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">Home</span></button>
                            <button onClick={() => { setIsMenuOpen(true); setViewMode('manual'); }} className={`flex flex-col items-center gap-1 flex-1 relative ${isMenuOpen ? 'bottom-nav-active' : 'text-slate-500'}`}><Icons.BookOpen className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">Manuals</span></button>
                            <button onClick={() => window.location.reload()} className="flex flex-col items-center gap-1 text-slate-500 flex-1"><Icons.RotateCw className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">Sync</span></button>
                            <button onClick={() => { setViewMode('directory'); setSelectedMachine(null); setIsMenuOpen(false); }} className={`flex flex-col items-center gap-1 flex-1 relative ${viewMode === 'directory' && !isMenuOpen ? 'bottom-nav-active' : 'text-slate-500'}`}><Icons.Phone className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">Support</span></button>
                            <button onClick={() => { setViewMode('ai'); setSelectedMachine(null); setIsMenuOpen(false); }} className={`flex flex-col items-center gap-1 flex-1 relative ${viewMode === 'ai' && !isMenuOpen ? 'bottom-nav-active' : 'text-slate-500 text-purple-400/70'}`}><Icons.Sparkles className="w-5 h-5" /><span className="text-[8px] font-black uppercase tracking-tighter">AI Help</span></button>
                        </nav>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
