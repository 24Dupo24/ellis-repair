<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ellis Coffee Part Finder</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for running JSX in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; }
        iframe { background-color: #525659; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // Lucide Icons components for React
        const Search = () => <i data-lucide="search"></i>;
        const BookOpen = () => <i data-lucide="book-open"></i>;
        const Zap = ({ className }) => <i data-lucide="zap" className={className}></i>;
        const Menu = () => <i data-lucide="menu"></i>;
        const X = () => <i data-lucide="x"></i>;
        const ChevronRight = () => <i data-lucide="chevron-right"></i>;
        const FileText = ({ className }) => <i data-lucide="file-text" className={className}></i>;

        // CONFIGURATION: Replace this base URL with your GitHub Pages URL or folder
        const BASE_PDF_PATH = "work/"; 

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMachine, setSelectedMachine] = useState(null);
            const [isMenuOpen, setIsMenuOpen] = useState(true);
            const [pdfPage, setPdfPage] = useState(1);

            // Initialize Lucide icons whenever the component renders or menu opens
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const machines = [
                { id: 1, name: "Bunn ICB-DV", file: "Bunn_ICB.pdf", explosionPage: 12, wiringPage: 45 },
                { id: 2, name: "Fetco G3 CBS-2131", file: "Fetco_2131.pdf", explosionPage: 8, wiringPage: 22 },
                { id: 3, name: "Curtis G4 Thermopro", file: "Curtis_G4.pdf", explosionPage: 15, wiringPage: 30 },
                { id: 4, name: "Bunn Heat Element Kit", file: "Bunn_Heaters.pdf", explosionPage: 1, wiringPage: 5 },
            ];

            const filteredMachines = useMemo(() => {
                return machines.filter(m => 
                    m.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    m.file.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [searchQuery]);

            const handleSelectMachine = (machine) => {
                setSelectedMachine(machine);
                setPdfPage(1);
                setIsMenuOpen(false);
            };

            const jumpToPage = (page) => {
                setPdfPage(page);
            };

            const pdfUrl = selectedMachine 
                ? `${BASE_PDF_PATH}${selectedMachine.file}#page=${pdfPage}`
                : null;

            return (
                <div className="flex flex-col h-screen bg-slate-900 text-white font-sans overflow-hidden">
                    <header className="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center z-50 shadow-lg">
                        <div className="flex items-center gap-2">
                            <div className="bg-red-600 p-1.5 rounded-lg flex items-center justify-center">
                                <Zap className="w-5 h-5" />
                            </div>
                            <h1 className="font-bold tracking-tight text-lg uppercase">Ellis Coffee <span className="font-light text-slate-400">Parts</span></h1>
                        </div>
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 hover:bg-slate-700 rounded-full">
                            {isMenuOpen ? <X /> : <Menu />}
                        </button>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        <div className={`fixed inset-0 z-40 bg-slate-900 transition-transform duration-300 transform ${isMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 md:w-80 border-r border-slate-800 flex flex-col`}>
                            <div className="p-4">
                                <div className="relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Search /></div>
                                    <input
                                        type="text"
                                        placeholder="Search models..."
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto px-2 pb-20">
                                <h3 className="px-4 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">Manuals ({filteredMachines.length})</h3>
                                {filteredMachines.map(machine => (
                                    <button
                                        key={machine.id}
                                        onClick={() => handleSelectMachine(machine)}
                                        className={`w-full text-left p-4 rounded-xl mb-1 flex items-center justify-between transition-all ${selectedMachine?.id === machine.id ? 'bg-red-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                                    >
                                        <div className="flex items-center gap-3">
                                            <FileText className={selectedMachine?.id === machine.id ? 'text-white' : 'text-slate-500'} />
                                            <span className="font-medium text-sm">{machine.name}</span>
                                        </div>
                                        <ChevronRight />
                                    </button>
                                ))}
                            </div>
                        </div>

                        <main className="flex-1 bg-slate-950 flex flex-col relative">
                            {selectedMachine ? (
                                <>
                                    <div className="flex-1 w-full bg-slate-800">
                                        <iframe
                                            key={`${selectedMachine.id}-${pdfPage}`}
                                            src={pdfUrl}
                                            className="w-full h-full border-none"
                                        />
                                    </div>
                                    <div className="bg-slate-900 border-t border-slate-800 p-4 flex gap-3 shadow-lg">
                                        <button onClick={() => jumpToPage(selectedMachine.explosionPage)} className="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-semibold text-sm">
                                            <BookOpen /> Exploded View
                                        </button>
                                        <button onClick={() => jumpToPage(selectedMachine.wiringPage)} className="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-semibold text-sm">
                                            <Zap className="text-yellow-400" /> Wiring Map
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-500">
                                    <div className="bg-slate-900 p-6 rounded-full mb-4"><BookOpen /></div>
                                    <h2 className="text-xl font-bold text-slate-300 mb-2">Ready for Repair</h2>
                                    <p className="max-w-xs text-sm">Select a machine from the list to view its schematics.</p>
                                    {!isMenuOpen && <button onClick={() => setIsMenuOpen(true)} className="mt-6 bg-red-600 text-white px-6 py-2 rounded-full font-bold">Open List</button>}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
